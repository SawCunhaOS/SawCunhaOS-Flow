server:
  port: ${scos.port:8080}
  http2:
    enabled: true
  servlet:
    context-path: /organization
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,application/json,application/xml
  tomcat:
    connection-timeout: 120000
    keep-alive-timeout: 60000
    max-connections: 5000
    max-http-header-size: 8192
    max-swallow-size: 20971520
    max-post-size: 20971520
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  grpc:
    server:
      # Aumenta o tempo de tolerância para fechar conexões antigas de forma segura
      max-connection-age-grace: 30s
      # Define o tempo máximo que uma conexão pode ficar ociosa
      max-connection-idle: 30m
      # Evita que o servidor derrube conexões ativas muito rápido
      max-connection-age: 1h
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  application:
    name: ScosOrganizationBoot
  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false
  cache:
    enabled: ${scos.cache.enable:false}
    type: redis
    redis:
      key-prefix: ${scos.cache.key-prefix}
      time-to-live: ${scos.cache.time-to-live}
  data:
    redis:
      database: ${scos.cache.database}
      repositories:
        enabled: false
      port: ${scos.cache.port}
      password: ${scos.cache.password}
      timeout: 5000ms
      sentinel:
        master: ${scos.cache.master}
        nodes: ${scos.cache.sentinels}
        
  datasource:
    url: ${scos.datasource.url}
    username: ${scos.datasource.username}
    password: ${scos.datasource.password}
    hikari:
      pool-name: Inside_Flow-Fat
      registerMbeans: false
      connection-timeout: ${scos.datasource.connection-timeout}
      idle-timeout: ${scos.datasource.idle-timeout}
      max-lifetime: ${scos.datasource.max-lifetime}
      minimum-idle: ${scos.datasource.minimum-idle}
      maximum-pool-size: ${scos.datasource.maximum-pool-size}
      leak-detection-threshold: 0
      validation-timeout: 15000
      keepalive-time: 300000
    audit:
      url: ${scos.audit.datasource.url}
      username: ${scos.audit.datasource.username}
      password: ${scos.audit.datasource.password}
      hikari:
        pool-name: Inside_Flow_Audit-Fat
        registerMbeans: false
        connection-timeout: ${scos.audit.datasource.connection-timeout}
        idle-timeout: ${scos.audit.datasource.idle-timeout}
        max-lifetime: ${scos.audit.datasource.max-lifetime}
        minimum-idle: ${scos.audit.datasource.minimum-idle}
        maximum-pool-size: ${scos.audit.datasource.maximum-pool-size}
        leak-detection-threshold: 20000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: false
        data-source-properties:
          cachePrepStmts: true
          prepStmtCacheSize: 1000
          prepStmtCacheSqlLimit: 4096
          useServerPrepStmts: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        enable_lazy_load_no_trans: false
        ddl-auto: validate
        generate_statistics: true
        naming:
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
          physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        cache:
          use_second_level_cache: false
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
        jdbc:
          batch_size: 100
          order_updates: true
          order_inserts: true
          batch_versioned_data: true
          time_zone: UTC
        connection:
          provider_disables_autocommit: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 4096
          fail_on_pagination_over_collection_fetch: true
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${scos.security.keycloak.client-id}
            authorization-grant-type: ${scos.security.keycloak.authorization-grant-type}
            scope: ${scos.security.keycloak.scope}
        provider:
          keycloak:
            issuer-uri: ${scos.security.keycloak.issuer-uri}
            user-name-attribute: preferred_username
          
      resourceserver:
        jwt:
          issuer-uri: ${scos.security.keycloak.issuer-uri}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    build:
      enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  management:
    metrics:
      enable:
        jvm: true
        process: true
        system: true
        executor: true
        jvm.threads: true
      export:
        prometheus:
          enabled: true
      distribution:
        percentiles-histogram:
          http.server.requests: true
        sla:
          http:
            server:
              requests: 50ms,100ms,200ms,300ms,500ms,1s
      tags:
        application: Inside_Flow-Fat
    observations:
      key-values:
        application: ${spring.application.name}

scos:
  liquibase:
    enabled: true
    contexts: prod
    database-change-log-lock-table: SCOS_DATABASECHANGELOGLOCK
    database-change-log-table: SCOS_DATABASECHANGELOG
    change-log: classpath:/db/changelog/db.changelog-master.yml
    default-schema: scos
  filter:
    show-request-body: false
    show-request-headers: false
    show-response-body: false
  audit:
    system: SCOS_ORGANIZATION
    enabled: ${scos.audit.enabled}
    liquibase:
      enabled: true
      contexts: prod
      database-change-log-lock-table: IF_DATABASECHANGELOGLOCK
      database-change-log-table: IF_DATABASECHANGELOG
      change-log: classpath:db/changelog/db_audit.changelog-master.yaml
      default-schema: scos
  jdempotent:
    enabled: ${scos.jdempotent.enabled:false}
    cache:
      redis:
        expirationTimeHour: ${scos.jdempotent.expiration-time-hour}
        dialTimeoutSecond: ${scos.jdempotent.dial-timeout-second}
        readTimeoutSecond: ${scos.jdempotent.read-timeout-second}
        writeTimeoutSecond: ${scos.jdempotent.write-timeout-second}
        maxRetryCount: ${scos.jdempotent.max-retry-count}
        expireTimeoutHour: ${scos.jdempotent.expire-timeout-hour}
    cryptography:
      algorithm: md5
  cache:
    caches:
      []
    redis-time-to-live: ${scos.cache.time-to-live}
    key-prefix: ${scos.cache.key-prefix}
  security:
    enabled: true
  registry:
    host: localhost           # host do scos-registry
    port: 8090                # porta gRPC
    key-access: ABLABLABLA
    system-code: SCOS_ORGANIZATION
    system-name: Scos Organization
    system-description: Sistema de Gestão de Empresas e Funcionarios
    tls-enabled: false        # true em produção