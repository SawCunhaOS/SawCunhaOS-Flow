databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-022
      author: Samuel.Cunha
      comment: "Trigger trg_check_employee_supervisor: impede que SUPERVISOR_ID == EMPLOYEE_ID"
      changes:
        - sqlFile:
            path: trg_check_employee_supervisor.sql
            relativeToChangelogFile: true
            encoding: utf8
            stripComments: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_check_employee_supervisor ON scos.SCOS_EMPLOYEE;

