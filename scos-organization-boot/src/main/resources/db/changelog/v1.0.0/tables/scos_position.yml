databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-003
      author: Samuel.Cunha
      comment: "Criação da sequence e tabela SCOS_POSITION"
      changes:
        - createSequence:
            sequenceName: SEQ_POSITION_ID
            schemaName: scos
            startValue: 1
            incrementBy: 50
            cycle: false

        - createTable:
            tableName: SCOS_POSITION
            schemaName: scos
            columns:
              - column:
                  name: POSITION_ID
                  type: BIGINT
                  defaultValueSequenceNext: SEQ_POSITION_ID
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_POSITION
                    nullable: false
              - column:
                  name: DEPARTMENT_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_DEPARTMENT_ID_SCOS_POSITION
                    validateForeignKey: true
                    referencedColumnNames: DEPARTMENT_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_DEPARTMENT
              - column:
                  name: CODE
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: SCOS_POSITION
            schemaName: scos
            columnNames: CODE
            constraintName: UK_CODE_SCOS_POSITION
            validate: true
        - createIndex:
            tableName: SCOS_POSITION
            schemaName: scos
            indexName: IDX_DEPARTMENT_ID_SCOS_POSITION
            columns:
              - column:
                  name: DEPARTMENT_ID
      rollback:
        - dropTable:
            tableName: SCOS_POSITION
            schemaName: scos
            cascadeConstraints: true
        - dropSequence:
            sequenceName: SEQ_POSITION_ID
            schemaName: scos
