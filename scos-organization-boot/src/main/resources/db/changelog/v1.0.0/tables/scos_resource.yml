databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-011
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_RESOURCE"
      changes:
        - createTable:
            tableName: SCOS_RESOURCE
            schemaName: scos
            columns:
              - column:
                  name: RESOURCE_ID
                  type: UUID
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_RESOURCE
                    nullable: false
              - column:
                  name: SYSTEM_ID
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: FK_SYSTEM_ID_SCOS_RESOURCE
                    references: scos.SCOS_SYSTEM(SYSTEM_ID)
              - column:
                  name: CODE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION_PT
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION_EN
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: RESOURCE_GROUP
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: SUB_GROUP
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: VERSION
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: DEFINITION_UPDATED_AT
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_RESOURCE
            schemaName: scos
            columnNames: CODE
            constraintName: UK_CODE_SCOS_RESOURCE
            validate: true
        - createIndex:
            tableName: SCOS_RESOURCE
            schemaName: scos
            indexName: IDX_SYSTEM_ID_SCOS_RESOURCE
            columns:
              - column:
                  name: SYSTEM_ID
      rollback:
        - dropTable:
            tableName: SCOS_RESOURCE
            schemaName: scos
            cascadeConstraints: true
