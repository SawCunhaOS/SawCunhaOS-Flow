databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-016
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_INTEGRATION_KEYCLOAK_LOG (imutável)"
      changes:
        - createTable:
            tableName: SCOS_INTEGRATION_KEYCLOAK_LOG
            schemaName: scos
            columns:
              - column:
                  name: INTEGRATION_KEYCLOAK_LOG_ID
                  type: UUID
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_INTEGRATION_KEYCLOAK_LOG
                    nullable: false
              - column:
                  name: INTEGRATION_KEYCLOAK_ID
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: FK_INTEGRATION_KEYCLOAK_ID_SCOS_INTEGRATION_KEYCLOAK_LOG
                    references: scos.SCOS_INTEGRATION_KEYCLOAK(INTEGRATION_KEYCLOAK_ID)
              - column:
                  name: SUCCESS
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: RESPONSE
                  type: varchar(5000)
                  constraints:
                    nullable: true
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - createIndex:
            tableName: SCOS_INTEGRATION_KEYCLOAK_LOG
            schemaName: scos
            indexName: IDX_INTEGRATION_KEYCLOAK_ID_SCOS_INTEGRATION_KEYCLOAK_LOG
            columns:
              - column:
                  name: INTEGRATION_KEYCLOAK_ID
      rollback:
        - dropTable:
            tableName: SCOS_INTEGRATION_KEYCLOAK_LOG
            schemaName: scos
            cascadeConstraints: true
