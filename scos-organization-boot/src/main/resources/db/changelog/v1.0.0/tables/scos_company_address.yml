databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-004
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_COMPANY_ADDRESS"
      changes:
        - createTable:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            columns:
              - column:
                  name: COMPANY_ID_ADDRESS
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_COMPANY_ID_SCOS_COMPANY_ADDRESS
                    references: scos.SCOS_COMPANY(COMPANY_ID)
              - column:
                  name: TYPE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: NUMBER
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: COMPLEMENT
                  type: varchar(250)
                  constraints:
                    nullable: true
              - column:
                  name: GEOLOCATION
                  type: ${POINTType}
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            columnNames: COMPANY_ID_ADDRESS, COMPANY_ID
            constraintName: PK_SCOS_COMPANY_ADDRESS
        - addUniqueConstraint:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            columnNames: TYPE
            constraintName: UK_TYPE_SCOS_COMPANY_ADDRESS
            validate: true
        - createIndex:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            indexName: IDX_COMPANY_ID_SCOS_COMPANY_ADDRESS
            columns:
              - column:
                  name: COMPANY_ID
      rollback:
        - dropTable:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            cascadeConstraints: true
