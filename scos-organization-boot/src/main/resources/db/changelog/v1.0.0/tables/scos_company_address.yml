databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-005
      author: Samuel.Cunha
      comment: "Criação da sequence e tabela SCOS_COMPANY_ADDRESS"
      changes:
        - createSequence:
            sequenceName: SEQ_COMPANY_ADDRESS_ID
            schemaName: scos
            startValue: 1
            incrementBy: 50
            cycle: false

        - createTable:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            columns:
              - column:
                  name: COMPANY_ADDRESS_ID
                  type: BIGINT
                  defaultValueSequenceNext: SEQ_COMPANY_ADDRESS_ID
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_COMPANY_ADDRESS
                    nullable: false
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_COMPANY_ID_SCOS_COMPANY_ADDRESS
                    validateForeignKey: true
                    referencedColumnNames: COMPANY_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_COMPANY
              - column:
                  name: ADDRESS_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: NUMBER
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: COMPLEMENT
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: GEOLOCATION
                  type: ${POINTType}
                  remarks: Informs the latitude and longitude of the address
                  constraints:
                    nullable: true
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            columnNames: COMPANY_ID, ADDRESS_ID, TYPE
            constraintName: UK_COMPANY_ADDRESS_TYPE_SCOS_COMPANY_ADDRESS
            validate: true
        - createIndex:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            indexName: IDX_COMPANY_ID_SCOS_COMPANY_ADDRESS
            columns:
              - column:
                  name: COMPANY_ID
      rollback:
        - dropTable:
            tableName: SCOS_COMPANY_ADDRESS
            schemaName: scos
            cascadeConstraints: true
        - dropSequence:
            sequenceName: SEQ_COMPANY_ADDRESS_ID
            schemaName: scos
