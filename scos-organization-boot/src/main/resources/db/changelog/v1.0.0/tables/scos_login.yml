databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-012
      author: Samuel.Cunha
      comment: "Criação da sequence e tabela SCOS_LOGIN"
      changes:
        - createSequence:
            sequenceName: SEQ_LOGIN_ID
            schemaName: scos
            startValue: 1
            incrementBy: 50
            cycle: false

        - createTable:
            tableName: SCOS_LOGIN
            schemaName: scos
            columns:
              - column:
                  name: LOGIN_ID
                  type: BIGINT
                  defaultValueSequenceNext: SEQ_LOGIN_ID
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_LOGIN
                    nullable: false
              - column:
                  name: PROFILE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_PROFILE_ID_SCOS_LOGIN
                    validateForeignKey: true
                    referencedColumnNames: PROFILE_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_PROFILE
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_LOGIN
                    validateForeignKey: true
                    referencedColumnNames: EMPLOYEE_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_EMPLOYEE
              - column:
                  name: LOGIN
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: KEYCLOAK_ID
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: PASSWORD
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: SALT
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: STATUS
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: DATE_LAST_CHANGE_PASSWORD
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: SCOS_LOGIN
            schemaName: scos
            columnNames: LOGIN
            constraintName: UK_LOGIN_SCOS_LOGIN
            validate: true
        - createIndex:
            tableName: SCOS_LOGIN
            schemaName: scos
            indexName: IDX_EMPLOYEE_ID_SCOS_LOGIN
            columns:
              - column:
                  name: EMPLOYEE_ID
        - createIndex:
            tableName: SCOS_LOGIN
            schemaName: scos
            indexName: IDX_PROFILE_ID_SCOS_LOGIN
            columns:
              - column:
                  name: PROFILE_ID
      rollback:
        - dropTable:
            tableName: SCOS_LOGIN
            schemaName: scos
            cascadeConstraints: true
        - dropSequence:
            sequenceName: SEQ_LOGIN_ID
            schemaName: scos
