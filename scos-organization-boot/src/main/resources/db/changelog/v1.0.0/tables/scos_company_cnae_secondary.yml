databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-010
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_COMPANY_CNAE_SECONDARY"
      changes:
        - createTable:
            tableName: SCOS_COMPANY_CNAE_SECONDARY
            schemaName: scos
            columns:
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_COMPANY_ID_SCOS_COMPANY_CNAE_SECONDARY
                    references: scos.SCOS_COMPANY(COMPANY_ID)
              - column:
                  name: CNAE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_CNAE_ID_SCOS_COMPANY_CNAE_SECONDARY
                    references: scos.SCOS_CNAE(CNAE_ID)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: SCOS_COMPANY_CNAE_SECONDARY
            schemaName: scos
            columnNames: COMPANY_ID, CNAE_ID
            constraintName: PK_SCOS_COMPANY_CNAE_SECONDARY
      rollback:
        - dropTable:
            tableName: SCOS_COMPANY_CNAE_SECONDARY
            schemaName: scos
            cascadeConstraints: true
