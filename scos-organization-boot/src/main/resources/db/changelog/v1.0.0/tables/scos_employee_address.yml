databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-008
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_EMPLOYEE_ADDRESS (chave composta, sem sequence)"
      changes:
        - createTable:
            tableName: SCOS_EMPLOYEE_ADDRESS
            schemaName: scos
            columns:
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_EMPLOYEE_ADDRESS
                    validateForeignKey: true
                    referencedColumnNames: EMPLOYEE_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_EMPLOYEE
              - column:
                  name: ADDRESS_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: NUMBER
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: COMPLEMENT
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: GEOLOCATION
                  type: ${POINTType}
                  remarks: Informs the latitude and longitude of the address
                  constraints:
                    nullable: true
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addPrimaryKey:
            tableName: SCOS_EMPLOYEE_ADDRESS
            schemaName: scos
            columnNames: EMPLOYEE_ID, ADDRESS_ID
            constraintName: PK_SCOS_EMPLOYEE_ADDRESS
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE_ADDRESS
            schemaName: scos
            cascadeConstraints: true
