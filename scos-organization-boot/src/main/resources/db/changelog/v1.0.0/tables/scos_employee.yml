databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-007
      author: Samuel.Cunha
      comment: "Criação da sequence e tabela SCOS_EMPLOYEE"
      changes:
        - createSequence:
            sequenceName: SEQ_EMPLOYEE_ID
            schemaName: scos
            startValue: 1
            incrementBy: 50
            cycle: false

        - createTable:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            columns:
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  defaultValueSequenceNext: SEQ_EMPLOYEE_ID
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_EMPLOYEE
                    nullable: false
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_COMPANY_ID_SCOS_EMPLOYEE
                    validateForeignKey: true
                    referencedColumnNames: COMPANY_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_COMPANY
              - column:
                  name: POSITION_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_POSITION_ID_SCOS_EMPLOYEE
                    validateForeignKey: true
                    referencedColumnNames: POSITION_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_POSITION
              - column:
                  name: SUPERVISOR_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_SUPERVISOR_ID_SCOS_EMPLOYEE
                    validateForeignKey: true
                    referencedColumnNames: EMPLOYEE_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_EMPLOYEE
              - column:
                  name: NAME
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: NAME_TREATMENT
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: TAX_IDENTIFIER
                  type: varchar(11)
                  constraints:
                    nullable: false
              - column:
                  name: EMAIL
                  type: varchar(320)
                  constraints:
                    nullable: false
              - column:
                  name: BIRTH_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: DATE_OF_HIRING
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: OBSERVATION
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            columnNames: TAX_IDENTIFIER
            constraintName: UK_TAX_IDENTIFIER_SCOS_EMPLOYEE
            validate: true
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_COMPANY_ID_SCOS_EMPLOYEE
            columns:
              - column:
                  name: COMPANY_ID
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_POSITION_ID_SCOS_EMPLOYEE
            columns:
              - column:
                  name: POSITION_ID
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_SUPERVISOR_ID_SCOS_EMPLOYEE
            columns:
              - column:
                  name: SUPERVISOR_ID
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            cascadeConstraints: true
        - dropSequence:
            sequenceName: SEQ_EMPLOYEE_ID
            schemaName: scos
