databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-004
      author: Samuel.Cunha
      comment: "Criação da sequence e tabela SCOS_COMPANY"
      changes:
        - createSequence:
            sequenceName: SEQ_COMPANY_ID
            schemaName: scos
            startValue: 1
            incrementBy: 50
            cycle: false

        - createTable:
            tableName: SCOS_COMPANY
            schemaName: scos
            columns:
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  defaultValueSequenceNext: SEQ_COMPANY_ID
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_COMPANY
                    nullable: false
              - column:
                  name: NAME
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: NAME_TREATMENT
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: TAX_IDENTIFIER
                  type: varchar(14)
                  constraints:
                    nullable: false
              - column:
                  name: FOUNDATION_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: SECTOR_OF_ACTIVITY
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: PARENT_COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_PARENT_COMPANY_ID_SCOS_COMPANY
                    validateForeignKey: true
                    referencedColumnNames: COMPANY_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_COMPANY
              - column:
                  name: OBSERVATION
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: STATUS
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: SCOS_COMPANY
            schemaName: scos
            columnNames: TAX_IDENTIFIER
            constraintName: UK_TAX_IDENTIFIER_SCOS_COMPANY
            validate: true
        - createIndex:
            tableName: SCOS_COMPANY
            schemaName: scos
            indexName: IDX_PARENT_COMPANY_ID_SCOS_COMPANY
            columns:
              - column:
                  name: PARENT_COMPANY_ID
      rollback:
        - dropTable:
            tableName: SCOS_COMPANY
            schemaName: scos
            cascadeConstraints: true
        - dropSequence:
            sequenceName: SEQ_COMPANY_ID
            schemaName: scos
