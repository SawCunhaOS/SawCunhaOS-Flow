databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-009
      author: Samuel.Cunha
      comment: "Criação da sequence e tabela SCOS_EMPLOYEE_CONTACT"
      changes:
        - createSequence:
            sequenceName: SEQ_EMPLOYEE_CONTACT_ID
            schemaName: scos
            startValue: 1
            incrementBy: 50
            cycle: false

        - createTable:
            tableName: SCOS_EMPLOYEE_CONTACT
            schemaName: scos
            columns:
              - column:
                  name: CONTACT_ID
                  type: BIGINT
                  defaultValueSequenceNext: SEQ_EMPLOYEE_CONTACT_ID
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_EMPLOYEE_CONTACT
                    nullable: false
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_EMPLOYEE_CONTACT
                    validateForeignKey: true
                    referencedColumnNames: EMPLOYEE_ID
                    referencedTableSchemaName: scos
                    referencedTableName: SCOS_EMPLOYEE
              - column:
                  name: TYPE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: PHONE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - createIndex:
            tableName: SCOS_EMPLOYEE_CONTACT
            schemaName: scos
            indexName: IDX_EMPLOYEE_ID_SCOS_EMPLOYEE_CONTACT
            columns:
              - column:
                  name: EMPLOYEE_ID
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE_CONTACT
            schemaName: scos
            cascadeConstraints: true
        - dropSequence:
            sequenceName: SEQ_EMPLOYEE_CONTACT_ID
            schemaName: scos
