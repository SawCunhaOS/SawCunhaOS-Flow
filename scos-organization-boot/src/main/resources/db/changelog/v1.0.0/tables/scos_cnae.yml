databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-004
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_CNAE (tabela de referência, sobe vazia)"
      changes:
        - createTable:
            tableName: SCOS_CNAE
            schemaName: scos
            columns:
              - column:
                  name: CNAE_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_CNAE
                    nullable: false
              - column:
                  name: CODE
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_CNAE
            schemaName: scos
            columnNames: CODE
            constraintName: UK_CODE_SCOS_CNAE
            validate: true
      rollback:
        - dropTable:
            tableName: SCOS_CNAE
            schemaName: scos
            cascadeConstraints: true
