  # ============================================================
  # idx_reason_activate_entity_type (parcial — somente motivos ativos)
  # Lista de seleção filtrada por entidade.
  # ============================================================
  - changeSet:
      id: 20260701-Index-004
      author: Samuel.Cunha
      changes:
        - sql:
            sql: >-
              CREATE INDEX IF NOT EXISTS idx_reason_activate_entity_type
              ON scos.scos_reason_activate (entity_type)
              WHERE active = true;
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS scos.idx_reason_activate_entity_type;

