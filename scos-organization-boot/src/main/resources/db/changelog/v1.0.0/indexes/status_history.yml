databaseChangeLog:
  # ============================================================
  # idx_company_status_history_current
  # Consulta de status atual e usada pela trigger de sincronização a cada INSERT.
  # ============================================================
  - changeSet:
      id: 20260701-Index-001
      author: Samuel.Cunha
      changes:
        - sql:
            sql: >-
              CREATE INDEX IF NOT EXISTS idx_company_status_history_current
              ON scos.scos_company_status_history (company_id, created_at DESC);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS scos.idx_company_status_history_current;

