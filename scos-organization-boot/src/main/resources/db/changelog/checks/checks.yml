databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-022
      author: Samuel.Cunha
      comment: "CHECK constraints de vocabulário fechado (status, tipo, backend, dia da semana)"
      changes:
        - sql:
            sql: |
              ALTER TABLE scos.scos_company ADD CONSTRAINT chk_company_status CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED'));

              ALTER TABLE scos.scos_employee
                ADD CONSTRAINT chk_employee_status        CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED')),
                ADD CONSTRAINT chk_employee_contract_type CHECK (contract_type IN ('CLT', 'PJ', 'ESTAGIO', 'TEMPORARIO'));

              ALTER TABLE scos.scos_login
                ADD CONSTRAINT chk_login_status CHECK (status IN ('ACTIVE', 'INACTIVE', 'BLOCKED')),
                ADD CONSTRAINT chk_login_type   CHECK (type IN ('EMPLOYEE', 'EXTERNAL', 'SERVICE'));

              ALTER TABLE scos.scos_company_status_history
                ADD CONSTRAINT chk_company_status_history_status   CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED')),
                ADD CONSTRAINT chk_company_status_history_previous CHECK (previous_status IS NULL OR previous_status IN ('ACTIVE', 'INACTIVE', 'DISABLED'));

              ALTER TABLE scos.scos_employee_status_history
                ADD CONSTRAINT chk_employee_status_history_status   CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED')),
                ADD CONSTRAINT chk_employee_status_history_previous CHECK (previous_status IS NULL OR previous_status IN ('ACTIVE', 'INACTIVE', 'DISABLED'));

              ALTER TABLE scos.scos_login_status_history
                ADD CONSTRAINT chk_login_status_history_status   CHECK (status IN ('ACTIVE', 'INACTIVE', 'BLOCKED')),
                ADD CONSTRAINT chk_login_status_history_previous CHECK (previous_status IS NULL OR previous_status IN ('ACTIVE', 'INACTIVE', 'BLOCKED'));

              ALTER TABLE scos.scos_outbox_event ADD CONSTRAINT chk_outbox_event_status  CHECK (status  IN ('PENDING', 'PROCESSING', 'PROCESSED', 'FAILED'));
              ALTER TABLE scos.scos_outbox_topic ADD CONSTRAINT chk_outbox_topic_backend CHECK (backend IN ('PGMQ', 'KAFKA', 'DIRECT_API'));

              ALTER TABLE scos.scos_reason_activate   ADD CONSTRAINT chk_reason_activate_entity_type   CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));
              ALTER TABLE scos.scos_reason_inactivate ADD CONSTRAINT chk_reason_inactivate_entity_type CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));
              ALTER TABLE scos.scos_reason_disable    ADD CONSTRAINT chk_reason_disable_entity_type    CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));
              ALTER TABLE scos.scos_reason_enable     ADD CONSTRAINT chk_reason_enable_entity_type     CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));

              ALTER TABLE scos.scos_address_type ADD CONSTRAINT chk_address_type_entity_type CHECK (entity_type IN ('COMPANY', 'EMPLOYEE'));
              ALTER TABLE scos.scos_contact_type ADD CONSTRAINT chk_contact_type_entity_type CHECK (entity_type IN ('COMPANY', 'EMPLOYEE'));

              ALTER TABLE scos.scos_position_work_schedule ADD CONSTRAINT chk_position_work_schedule_day CHECK (day_of_week IN ('MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'));
              ALTER TABLE scos.scos_employee_work_schedule ADD CONSTRAINT chk_employee_work_schedule_day CHECK (day_of_week IN ('MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'));
      rollback:
        - sql:
            sql: |
              ALTER TABLE scos.scos_company DROP CONSTRAINT IF EXISTS chk_company_status;
              ALTER TABLE scos.scos_employee DROP CONSTRAINT IF EXISTS chk_employee_status;
              ALTER TABLE scos.scos_employee DROP CONSTRAINT IF EXISTS chk_employee_contract_type;
              ALTER TABLE scos.scos_login DROP CONSTRAINT IF EXISTS chk_login_status;
              ALTER TABLE scos.scos_login DROP CONSTRAINT IF EXISTS chk_login_type;
              ALTER TABLE scos.scos_company_status_history DROP CONSTRAINT IF EXISTS chk_company_status_history_status;
              ALTER TABLE scos.scos_company_status_history DROP CONSTRAINT IF EXISTS chk_company_status_history_previous;
              ALTER TABLE scos.scos_employee_status_history DROP CONSTRAINT IF EXISTS chk_employee_status_history_status;
              ALTER TABLE scos.scos_employee_status_history DROP CONSTRAINT IF EXISTS chk_employee_status_history_previous;
              ALTER TABLE scos.scos_login_status_history DROP CONSTRAINT IF EXISTS chk_login_status_history_status;
              ALTER TABLE scos.scos_login_status_history DROP CONSTRAINT IF EXISTS chk_login_status_history_previous;
              ALTER TABLE scos.scos_outbox_event DROP CONSTRAINT IF EXISTS chk_outbox_event_status;
              ALTER TABLE scos.scos_outbox_topic DROP CONSTRAINT IF EXISTS chk_outbox_topic_backend;
              ALTER TABLE scos.scos_reason_activate DROP CONSTRAINT IF EXISTS chk_reason_activate_entity_type;
              ALTER TABLE scos.scos_reason_inactivate DROP CONSTRAINT IF EXISTS chk_reason_inactivate_entity_type;
              ALTER TABLE scos.scos_reason_disable DROP CONSTRAINT IF EXISTS chk_reason_disable_entity_type;
              ALTER TABLE scos.scos_reason_enable DROP CONSTRAINT IF EXISTS chk_reason_enable_entity_type;
              ALTER TABLE scos.scos_address_type DROP CONSTRAINT IF EXISTS chk_address_type_entity_type;
              ALTER TABLE scos.scos_contact_type DROP CONSTRAINT IF EXISTS chk_contact_type_entity_type;
              ALTER TABLE scos.scos_position_work_schedule DROP CONSTRAINT IF EXISTS chk_position_work_schedule_day;
              ALTER TABLE scos.scos_employee_work_schedule DROP CONSTRAINT IF EXISTS chk_employee_work_schedule_day;
