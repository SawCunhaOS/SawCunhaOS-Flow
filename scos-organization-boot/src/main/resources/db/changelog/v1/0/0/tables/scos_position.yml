databaseChangeLog:
  - changeSet:
      id: SGC_1601202512432
      author: Samuel.Cunha
      changes:
        - tagDatabase:
            tag: v1.0.0
        - createTable:
            tableName: SCOS_POSITION
            columns:
              - column:
                  name:  POSITION_ID
                  type: serial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_POSITION
                    nullable: false
              - column:
                  name:  DEPARTMENT_ID
                  autoIncrement: false
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_DEPARTMENT_ID_SCOS_POSITION
                    validateForeignKey: true
                    referencedColumnNames: DEPARTMENT_ID
                    referencedTableName: SCOS_DEPARTMENT
              - column:
                  name:  CODE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name:  DESCRIPTION
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name:  CREATED_AT
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name:  UPDATED_AT
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name:  USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - renameSequence:
            oldSequenceName: SCOS_POSITION_POSITION_ID_SEQ
            newSequenceName: SEQ_POSITION_ID
        - addUniqueConstraint:
            columnNames: CODE
            constraintName: UK_CODE_SCOS_POSITION
            tableName: SCOS_POSITION
            validate: true
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: SCOS_POSITION
