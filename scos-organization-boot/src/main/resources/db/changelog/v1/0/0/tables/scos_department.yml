databaseChangeLog:
  - changeSet:
      id: SGC_1601202512431
      author: Samuel.Cunha
      changes:
        - tagDatabase:
            tag: v1.0.0
        - createTable:
            tableName: SCOS_DEPARTMENT
            columns:
              - column:
                  name: DEPARTMENT_ID
                  type: serial
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_DEPARTMENT
                    nullable: false
              - column:
                  name: CODE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: UPDATED_AT
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name: USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - renameSequence:
            oldSequenceName: SCOS_DEPARTMENT_DEPARTMENT_ID_SEQ
            newSequenceName: SEQ_DEPARTMENT_ID
        - addUniqueConstraint:
            columnNames: CODE
            constraintName: UK_CODE_SCOS_DEPARTMENT
            tableName: SCOS_DEPARTMENT
            validate: true
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: SCOS_DEPARTMENT
