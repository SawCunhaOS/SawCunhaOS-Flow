databaseChangeLog:
  - changeSet:
      id: SGC_1901202509252
      author: Samuel.Cunha
      changes:
        - tagDatabase:
            tag: v1.0.0
        - createTable:
            tableName: SCOS_COMPANY_ADDRESS
            columns:
              - column:
                  name:  COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_COMPANY_ID_SCOS_COMPANY_ADDRESS
                    validateForeignKey: true
                    referencedColumnNames: COMPANY_ID
                    referencedTableName: SCOS_COMPANY
              - column:
                  name:  ADDRESS_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name:  TYPE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name:  NUMBER
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name:  COMPLEMENT
                  type: LONGTEXT
                  constraints:
                    nullable: false
              - column:
                  name:  GEOLOCATION
                  autoIncrement: false
                  type: ${POINTType}
                  remarks: Informs the latitude and longitude of the Street
                  constraints:
                    nullable: true
              - column:
                  name:  CREATED_AT
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name:  UPDATED_AT
                  type: DATETIME
                  constraints:
                    nullable: true
              - column:
                  name:  USER_AT
                  type: varchar(100)
                  constraints:
                    nullable: true
        - addPrimaryKey:
            columnNames: COMPANY_ID, ADDRESS_ID
            constraintName: PK_SCOS_COMPANY_ADDRESS
            tableName: SCOS_COMPANY_ADDRESS
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: SCOS_COMPANY_ADDRESS