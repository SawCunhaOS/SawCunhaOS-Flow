databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-009
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_PROFILE"
      changes:
        - createTable:
            tableName: SCOS_PROFILE
            schemaName: scos
            columns:
              - column:
                  name: PROFILE_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_PROFILE
                    nullable: false
              - column:
                  name: CODE
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_PROFILE
            schemaName: scos
            columnNames: CODE
            constraintName: UK_CODE_SCOS_PROFILE
            validate: true
      rollback:
        - dropTable:
            tableName: SCOS_PROFILE
            schemaName: scos
            cascadeConstraints: true
