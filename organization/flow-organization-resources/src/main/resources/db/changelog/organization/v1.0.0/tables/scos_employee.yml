databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-006
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_EMPLOYEE"
      changes:
        - createTable:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            columns:
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_EMPLOYEE
                    nullable: false
              - column:
                  name: SUPERVISOR_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_SUPERVISOR_ID_SCOS_EMPLOYEE
                    references: scos.SCOS_EMPLOYEE(EMPLOYEE_ID)
              - column:
                  name: POSITION_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_POSITION_ID_SCOS_EMPLOYEE
                    references: scos.SCOS_POSITION(POSITION_ID)
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_COMPANY_ID_SCOS_EMPLOYEE
                    references: scos.SCOS_COMPANY(COMPANY_ID)
              - column:
                  name: NAME
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: NAME_TREATMENT
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: TAX_IDENTIFIER
                  type: varchar(11)
                  constraints:
                    nullable: false
              - column:
                  name: EMAIL
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: BIRTH_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: DATE_OF_HIRING
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: CONTRACT_TYPE
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: PROBATION_END_DATE
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: OBSERVATION
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: STATUS
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            columnNames: TAX_IDENTIFIER
            constraintName: UK_TAX_IDENTIFIER_SCOS_EMPLOYEE
            validate: true
        - addUniqueConstraint:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            columnNames: EMAIL
            constraintName: UK_EMAIL_SCOS_EMPLOYEE
            validate: true
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_COMPANY_ID_SCOS_EMPLOYEE
            columns:
              - column:
                  name: COMPANY_ID
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_POSITION_ID_SCOS_EMPLOYEE
            columns:
              - column:
                  name: POSITION_ID
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_SUPERVISOR_ID_SCOS_EMPLOYEE
            columns:
              - column:
                  name: SUPERVISOR_ID
        - createIndex:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            indexName: IDX_STATUS_SCOS_EMPLOYEE
            columns:
              - column:
                  name: STATUS
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE
            schemaName: scos
            cascadeConstraints: true
