databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-003
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_COMPANY"
      changes:
        - createTable:
            tableName: SCOS_COMPANY
            schemaName: scos
            columns:
              - column:
                  name: COMPANY_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_COMPANY
                    nullable: false
              - column:
                  name: PARENT_COMPANY_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_PARENT_COMPANY_ID_SCOS_COMPANY
                    references: scos.SCOS_COMPANY(COMPANY_ID)
              - column:
                  name: NAME
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: NAME_TREATMENT
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: TAX_IDENTIFIER
                  type: varchar(14)
                  constraints:
                    nullable: false
              - column:
                  name: LEGAL_NATURE_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_LEGAL_NATURE_ID_SCOS_COMPANY
                    references: scos.SCOS_LEGAL_NATURE(LEGAL_NATURE_ID)
              - column:
                  name: CNAE_PRINCIPAL_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_CNAE_PRINCIPAL_ID_SCOS_COMPANY
                    references: scos.SCOS_CNAE(CNAE_ID)
              - column:
                  name: STATE_REGISTRATION
                  type: varchar(20)
                  constraints:
                    nullable: true
              - column:
                  name: MUNICIPAL_REGISTRATION
                  type: varchar(20)
                  constraints:
                    nullable: true
              - column:
                  name: FOUNDATION_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: SECTOR_OF_ACTIVITY
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: OBSERVATION
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: STATUS
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_COMPANY
            schemaName: scos
            columnNames: TAX_IDENTIFIER
            constraintName: UK_TAX_IDENTIFIER_SCOS_COMPANY
            validate: true
        - createIndex:
            tableName: SCOS_COMPANY
            schemaName: scos
            indexName: IDX_PARENT_COMPANY_ID_SCOS_COMPANY
            columns:
              - column:
                  name: PARENT_COMPANY_ID
        - createIndex:
            tableName: SCOS_COMPANY
            schemaName: scos
            indexName: IDX_STATUS_SCOS_COMPANY
            columns:
              - column:
                  name: STATUS
        - createIndex:
            tableName: SCOS_COMPANY
            schemaName: scos
            indexName: IDX_LEGAL_NATURE_ID_SCOS_COMPANY
            columns:
              - column:
                  name: LEGAL_NATURE_ID
        - createIndex:
            tableName: SCOS_COMPANY
            schemaName: scos
            indexName: IDX_CNAE_PRINCIPAL_ID_SCOS_COMPANY
            columns:
              - column:
                  name: CNAE_PRINCIPAL_ID
      rollback:
        - dropTable:
            tableName: SCOS_COMPANY
            schemaName: scos
            cascadeConstraints: true
