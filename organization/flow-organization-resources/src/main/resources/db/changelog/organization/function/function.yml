databaseChangeLog:
  - changeSet:
      id: 20260228-Samuel.Cunha-018
      author: Samuel.Cunha
      comment: "Limpeza: remove funções legadas do schema public migradas para scos"
      dbms: postgresql
      changes:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS public.check_employee_supervisor() CASCADE;
              DROP FUNCTION IF EXISTS public.remove_formatting_tax_identifier() CASCADE;
      rollback:
        - empty

  - changeSet:
      id: 20260228-Samuel.Cunha-019
      author: Samuel.Cunha
      comment: "Função check_employee_supervisor: valida que SUPERVISOR_ID != EMPLOYEE_ID"
      runOnChange: true
      changes:
        - sqlFile:
            path: check_employee_supervisor.sql
            relativeToChangelogFile: true
            encoding: utf8
            stripComments: true
            splitStatements: false
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS check_employee_supervisor() CASCADE;

