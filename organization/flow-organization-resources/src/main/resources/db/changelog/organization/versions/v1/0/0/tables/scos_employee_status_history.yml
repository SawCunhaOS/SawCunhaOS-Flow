databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-020
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_EMPLOYEE_STATUS_HISTORY"
      changes:
        - createTable:
            tableName: SCOS_EMPLOYEE_STATUS_HISTORY
            columns:
              - column:
                  name: EMPLOYEE_STATUS_HISTORY_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_EMPLOYEE_STATUS_HISTORY
                    nullable: false
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_EMPLOYEE_STATUS_HISTORY
                    references: SCOS_EMPLOYEE(EMPLOYEE_ID)
              - column:
                  name: STATUS
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: PREVIOUS_STATUS
                  type: varchar(20)
                  constraints:
                    nullable: true
              - column:
                  name: REASON_ACTIVATE_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_REASON_ACTIVATE_ID_SCOS_EMPLOYEE_STATUS_HISTORY
                    references: SCOS_REASON_ACTIVATE(REASON_ACTIVATE_ID)
              - column:
                  name: REASON_INACTIVATE_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_REASON_INACTIVATE_ID_SCOS_EMPLOYEE_STATUS_HISTORY
                    references: SCOS_REASON_INACTIVATE(REASON_INACTIVATE_ID)
              - column:
                  name: REASON_DISABLE_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_REASON_DISABLE_ID_SCOS_EMPLOYEE_STATUS_HISTORY
                    references: SCOS_REASON_DISABLE(REASON_DISABLE_ID)
              - column:
                  name: REASON_ENABLE_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_REASON_ENABLE_ID_SCOS_EMPLOYEE_STATUS_HISTORY
                    references: SCOS_REASON_ENABLE(REASON_ENABLE_ID)
              - column:
                  name: OBSERVATION
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE_STATUS_HISTORY
            cascadeConstraints: true

  - changeSet:
      id: 20260815-Samuel.Cunha-001
      author: Samuel.Cunha
      comment: "Adiciona EXPECTED_RETURN_DATE em SCOS_EMPLOYEE_STATUS_HISTORY (Story 2.4 — licença/férias, FR-28)"
      changes:
        - addColumn:
            tableName: SCOS_EMPLOYEE_STATUS_HISTORY
            columns:
              - column:
                  name: EXPECTED_RETURN_DATE
                  type: DATE
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: SCOS_EMPLOYEE_STATUS_HISTORY
            columnName: EXPECTED_RETURN_DATE
