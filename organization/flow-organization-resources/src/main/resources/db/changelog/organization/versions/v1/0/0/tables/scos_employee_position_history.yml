databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-014
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_EMPLOYEE_POSITION_HISTORY"
      changes:
        - createTable:
            tableName: SCOS_EMPLOYEE_POSITION_HISTORY
            columns:
              - column:
                  name: EMPLOYEE_POSITION_HISTORY_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_EMPLOYEE_POSITION_HISTORY
                    nullable: false
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_EMPLOYEE_POSITION_HISTORY
                    references: SCOS_EMPLOYEE(EMPLOYEE_ID)
              - column:
                  name: POSITION_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_POSITION_ID_SCOS_EMPLOYEE_POSITION_HISTORY
                    references: SCOS_POSITION(POSITION_ID)
              - column:
                  name: START_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: END_DATE
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: REASON_POSITION_CHANGE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_REASON_POSITION_CHANGE_ID_SCOS_EMPLOYEE_POSITION_HISTORY
                    references: SCOS_REASON_POSITION_CHANGE(REASON_POSITION_CHANGE_ID)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: SCOS_EMPLOYEE_POSITION_HISTORY
            indexName: IDX_POSITION_ID_SCOS_EMPLOYEE_POSITION_HISTORY
            columns:
              - column:
                  name: POSITION_ID
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE_POSITION_HISTORY
            cascadeConstraints: true
