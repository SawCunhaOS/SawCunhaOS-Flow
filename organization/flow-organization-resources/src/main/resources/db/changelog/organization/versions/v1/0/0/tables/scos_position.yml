databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-002
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_POSITION"
      changes:
        - createTable:
            tableName: SCOS_POSITION
            columns:
              - column:
                  name: POSITION_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_POSITION
                    nullable: false
              - column:
                  name: DEPARTMENT_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_DEPARTMENT_ID_SCOS_POSITION
                    references: SCOS_DEPARTMENT(DEPARTMENT_ID)
              - column:
                  name: CODE
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: IS_TRUST_POSITION
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_POSITION
            columnNames: CODE, DEPARTMENT_ID
            constraintName: UK_CODE_DEPARTMENT_ID_SCOS_POSITION
            validate: true
        - createIndex:
            tableName: SCOS_POSITION
            indexName: IDX_DEPARTMENT_ID_SCOS_POSITION
            columns:
              - column:
                  name: DEPARTMENT_ID
      rollback:
        - dropTable:
            tableName: SCOS_POSITION
            cascadeConstraints: true
