databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-008
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_EMPLOYEE_CONTACT"
      changes:
        - createTable:
            tableName: SCOS_EMPLOYEE_CONTACT
            columns:
              - column:
                  name: EMPLOYEE_ID_CONTACT
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_EMPLOYEE_CONTACT
                    nullable: false
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_EMPLOYEE_CONTACT
                    references: SCOS_EMPLOYEE(EMPLOYEE_ID)
              - column:
                  name: PHONE
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: CONTACT_TYPE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_CONTACT_TYPE_ID_SCOS_EMPLOYEE_CONTACT
                    references: SCOS_CONTACT_TYPE(CONTACT_TYPE_ID)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_EMPLOYEE_CONTACT
            columnNames: PHONE, EMPLOYEE_ID
            constraintName: UK_PHONE_EMPLOYEE_ID_SCOS_EMPLOYEE_CONTACT
            validate: true
        - addUniqueConstraint:
            tableName: SCOS_EMPLOYEE_CONTACT
            columnNames: CONTACT_TYPE_ID, EMPLOYEE_ID
            constraintName: UK_CONTACT_TYPE_ID_EMPLOYEE_ID_SCOS_EMPLOYEE_CONTACT
            validate: true
        - createIndex:
            tableName: SCOS_EMPLOYEE_CONTACT
            indexName: IDX_EMPLOYEE_ID_SCOS_EMPLOYEE_CONTACT
            columns:
              - column:
                  name: EMPLOYEE_ID
        - createIndex:
            tableName: SCOS_EMPLOYEE_CONTACT
            indexName: IDX_CONTACT_TYPE_ID_SCOS_EMPLOYEE_CONTACT
            columns:
              - column:
                  name: CONTACT_TYPE_ID
      rollback:
        - dropTable:
            tableName: SCOS_EMPLOYEE_CONTACT
            cascadeConstraints: true
