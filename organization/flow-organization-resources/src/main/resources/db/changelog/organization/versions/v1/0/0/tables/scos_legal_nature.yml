databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-003
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_LEGAL_NATURE (tabela de referência, sobe vazia)"
      changes:
        - createTable:
            tableName: SCOS_LEGAL_NATURE
            columns:
              - column:
                  name: LEGAL_NATURE_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_LEGAL_NATURE
                    nullable: false
              - column:
                  name: CODE
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_LEGAL_NATURE
            columnNames: CODE
            constraintName: UK_CODE_SCOS_LEGAL_NATURE
            validate: true
      rollback:
        - dropTable:
            tableName: SCOS_LEGAL_NATURE
            cascadeConstraints: true
  - changeSet:
      id: 20260707-Samuel.Cunha-002
      author: Samuel.Cunha
      comment: "Alinha SCOS_LEGAL_NATURE.CODE a varchar(30) conforme UC-094 (era varchar(10)); UK_CODE_SCOS_LEGAL_NATURE preservada"
      changes:
        - modifyDataType:
            tableName: SCOS_LEGAL_NATURE
            columnName: CODE
            newDataType: varchar(30)
      rollback:
        - modifyDataType:
            tableName: SCOS_LEGAL_NATURE
            columnName: CODE
            newDataType: varchar(10)
