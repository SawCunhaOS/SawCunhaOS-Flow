databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-013
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_REASON_POSITION_CHANGE"
      changes:
        - createTable:
            tableName: SCOS_REASON_POSITION_CHANGE
            columns:
              - column:
                  name: REASON_POSITION_CHANGE_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_REASON_POSITION_CHANGE
                    nullable: false
              - column:
                  name: CODE
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_REASON_POSITION_CHANGE
            columnNames: CODE
            constraintName: UK_CODE_SCOS_REASON_POSITION_CHANGE
            validate: true
      rollback:
        - dropTable:
            tableName: SCOS_REASON_POSITION_CHANGE
            cascadeConstraints: true
