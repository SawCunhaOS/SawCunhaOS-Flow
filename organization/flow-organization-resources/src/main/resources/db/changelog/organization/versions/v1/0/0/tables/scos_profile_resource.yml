databaseChangeLog:
  - changeSet:
      id: 20260606-Samuel.Cunha-012
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_PROFILE_RESOURCE"
      changes:
        - createTable:
            tableName: SCOS_PROFILE_RESOURCE
            columns:
              - column:
                  name: PROFILE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_PROFILE_ID_SCOS_PROFILE_RESOURCE
                    references: SCOS_PROFILE(PROFILE_ID)
              - column:
                  name: RESOURCE_ID
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: FK_RESOURCE_ID_SCOS_PROFILE_RESOURCE
                    references: SCOS_RESOURCE(RESOURCE_ID)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: SCOS_PROFILE_RESOURCE
            columnNames: PROFILE_ID, RESOURCE_ID
            constraintName: PK_SCOS_PROFILE_RESOURCE
        - createIndex:
            tableName: SCOS_PROFILE_RESOURCE
            indexName: IDX_PROFILE_ID_SCOS_PROFILE_RESOURCE
            columns:
              - column:
                  name: PROFILE_ID
        - createIndex:
            tableName: SCOS_PROFILE_RESOURCE
            indexName: IDX_RESOURCE_ID_SCOS_PROFILE_RESOURCE
            columns:
              - column:
                  name: RESOURCE_ID
      rollback:
        - dropTable:
            tableName: SCOS_PROFILE_RESOURCE
            cascadeConstraints: true
