databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-022
      author: Samuel.Cunha
      comment: "CHECK constraints de vocabulário fechado (status, tipo, backend, dia da semana)"
      changes:
        - sql:
            sql: |
              ALTER TABLE scos_company ADD CONSTRAINT chk_company_status CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED'));

              ALTER TABLE scos_employee
                ADD CONSTRAINT chk_employee_status        CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED')),
                ADD CONSTRAINT chk_employee_contract_type CHECK (contract_type IN ('CLT', 'PJ', 'ESTAGIO', 'TEMPORARIO'));

              ALTER TABLE scos_login
                ADD CONSTRAINT chk_login_status CHECK (status IN ('PENDING_APPROVAL', 'ACTIVE', 'INACTIVE', 'BLOCKED', 'REJECTED')),
                ADD CONSTRAINT chk_login_type   CHECK (type IN ('EMPLOYEE', 'EXTERNAL', 'SERVICE'));

              ALTER TABLE scos_company_status_history
                ADD CONSTRAINT chk_company_status_history_status   CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED')),
                ADD CONSTRAINT chk_company_status_history_previous CHECK (previous_status IS NULL OR previous_status IN ('ACTIVE', 'INACTIVE', 'DISABLED'));

              ALTER TABLE scos_employee_status_history
                ADD CONSTRAINT chk_employee_status_history_status   CHECK (status IN ('ACTIVE', 'INACTIVE', 'DISABLED')),
                ADD CONSTRAINT chk_employee_status_history_previous CHECK (previous_status IS NULL OR previous_status IN ('ACTIVE', 'INACTIVE', 'DISABLED'));

              ALTER TABLE scos_login_status_history
                ADD CONSTRAINT chk_login_status_history_status   CHECK (status IN ('PENDING_APPROVAL', 'ACTIVE', 'INACTIVE', 'BLOCKED', 'REJECTED')),
                ADD CONSTRAINT chk_login_status_history_previous CHECK (previous_status IS NULL OR previous_status IN ('PENDING_APPROVAL', 'ACTIVE', 'INACTIVE', 'BLOCKED', 'REJECTED'));

              ALTER TABLE scos_login_approval_request
                ADD CONSTRAINT chk_login_approval_request_level  CHECK (current_level IN ('SUPERVISOR', 'MANAGER', 'SYSTEM_ACCESS_GROUP')),
                ADD CONSTRAINT chk_login_approval_request_policy CHECK (escalation_policy IN ('INDEFINITE', 'AUTO_CANCEL')),
                ADD CONSTRAINT chk_login_approval_request_status CHECK (status IN ('PENDING', 'APPROVED', 'REJECTED', 'CANCELLED')),
                ADD CONSTRAINT chk_login_approval_request_requester CHECK (
                  (escalation_policy = 'AUTO_CANCEL' AND requested_by_login_id IS NULL)
                  OR
                  (escalation_policy = 'INDEFINITE' AND requested_by_login_id IS NOT NULL)
                );

              ALTER TABLE scos_shift_enforcement_log
                ADD CONSTRAINT chk_shift_enforcement_log_decision   CHECK (decision IN ('ALLOWED', 'DENIED')),
                ADD CONSTRAINT chk_shift_enforcement_log_allowed_via CHECK (allowed_via IS NULL OR allowed_via IN ('REGULAR_SCHEDULE', 'ON_CALL_WINDOW', 'UNRESTRICTED_PROFILE'));

              ALTER TABLE scos_outbox_event ADD CONSTRAINT chk_outbox_event_status  CHECK (status  IN ('PENDING', 'PROCESSING', 'PROCESSED', 'FAILED'));
              ALTER TABLE scos_outbox_topic ADD CONSTRAINT chk_outbox_topic_backend CHECK (backend IN ('PGMQ', 'KAFKA', 'DIRECT_API'));

              ALTER TABLE scos_reason_activate   ADD CONSTRAINT chk_reason_activate_entity_type   CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));
              ALTER TABLE scos_reason_inactivate ADD CONSTRAINT chk_reason_inactivate_entity_type CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));
              ALTER TABLE scos_reason_disable    ADD CONSTRAINT chk_reason_disable_entity_type    CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));
              ALTER TABLE scos_reason_enable     ADD CONSTRAINT chk_reason_enable_entity_type     CHECK (entity_type IN ('COMPANY', 'EMPLOYEE', 'LOGIN'));

              ALTER TABLE scos_address_type ADD CONSTRAINT chk_address_type_entity_type CHECK (entity_type IN ('COMPANY', 'EMPLOYEE'));
              ALTER TABLE scos_contact_type ADD CONSTRAINT chk_contact_type_entity_type CHECK (entity_type IN ('COMPANY', 'EMPLOYEE'));

              ALTER TABLE scos_position_work_schedule ADD CONSTRAINT chk_position_work_schedule_day CHECK (day_of_week IN ('MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'));
              ALTER TABLE scos_employee_work_schedule ADD CONSTRAINT chk_employee_work_schedule_day CHECK (day_of_week IN ('MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'));
      rollback:
        - sql:
            sql: |
              ALTER TABLE scos_company DROP CONSTRAINT IF EXISTS chk_company_status;
              ALTER TABLE scos_employee DROP CONSTRAINT IF EXISTS chk_employee_status;
              ALTER TABLE scos_employee DROP CONSTRAINT IF EXISTS chk_employee_contract_type;
              ALTER TABLE scos_login DROP CONSTRAINT IF EXISTS chk_login_status;
              ALTER TABLE scos_login DROP CONSTRAINT IF EXISTS chk_login_type;
              ALTER TABLE scos_company_status_history DROP CONSTRAINT IF EXISTS chk_company_status_history_status;
              ALTER TABLE scos_company_status_history DROP CONSTRAINT IF EXISTS chk_company_status_history_previous;
              ALTER TABLE scos_employee_status_history DROP CONSTRAINT IF EXISTS chk_employee_status_history_status;
              ALTER TABLE scos_employee_status_history DROP CONSTRAINT IF EXISTS chk_employee_status_history_previous;
              ALTER TABLE scos_login_status_history DROP CONSTRAINT IF EXISTS chk_login_status_history_status;
              ALTER TABLE scos_login_status_history DROP CONSTRAINT IF EXISTS chk_login_status_history_previous;
              ALTER TABLE scos_login_approval_request DROP CONSTRAINT IF EXISTS chk_login_approval_request_level;
              ALTER TABLE scos_login_approval_request DROP CONSTRAINT IF EXISTS chk_login_approval_request_policy;
              ALTER TABLE scos_login_approval_request DROP CONSTRAINT IF EXISTS chk_login_approval_request_status;
              ALTER TABLE scos_login_approval_request DROP CONSTRAINT IF EXISTS chk_login_approval_request_requester;
              ALTER TABLE scos_shift_enforcement_log DROP CONSTRAINT IF EXISTS chk_shift_enforcement_log_decision;
              ALTER TABLE scos_shift_enforcement_log DROP CONSTRAINT IF EXISTS chk_shift_enforcement_log_allowed_via;
              ALTER TABLE scos_outbox_event DROP CONSTRAINT IF EXISTS chk_outbox_event_status;
              ALTER TABLE scos_outbox_topic DROP CONSTRAINT IF EXISTS chk_outbox_topic_backend;
              ALTER TABLE scos_reason_activate DROP CONSTRAINT IF EXISTS chk_reason_activate_entity_type;
              ALTER TABLE scos_reason_inactivate DROP CONSTRAINT IF EXISTS chk_reason_inactivate_entity_type;
              ALTER TABLE scos_reason_disable DROP CONSTRAINT IF EXISTS chk_reason_disable_entity_type;
              ALTER TABLE scos_reason_enable DROP CONSTRAINT IF EXISTS chk_reason_enable_entity_type;
              ALTER TABLE scos_address_type DROP CONSTRAINT IF EXISTS chk_address_type_entity_type;
              ALTER TABLE scos_contact_type DROP CONSTRAINT IF EXISTS chk_contact_type_entity_type;
              ALTER TABLE scos_position_work_schedule DROP CONSTRAINT IF EXISTS chk_position_work_schedule_day;
              ALTER TABLE scos_employee_work_schedule DROP CONSTRAINT IF EXISTS chk_employee_work_schedule_day;

  - changeSet:
      id: 20260816-Samuel.Cunha-002
      author: Samuel.Cunha
      comment: "CHECK de REQUEST_TYPE em SCOS_LOGIN_APPROVAL_REQUEST (Epic 3)"
      changes:
        - sql:
            sql: >-
              ALTER TABLE scos_login_approval_request
                ADD CONSTRAINT chk_login_approval_request_type CHECK (request_type IN ('CREATE_LOGIN', 'REACTIVATE_LOGIN', 'CHANGE_PROFILE'));
      rollback:
        - sql:
            sql: ALTER TABLE scos_login_approval_request DROP CONSTRAINT IF EXISTS chk_login_approval_request_type;

  - changeSet:
      id: 20260817-Samuel.Cunha-002
      author: Samuel.Cunha
      comment: "CHECK de PROFILE_CHANGE_KIND em SCOS_LOGIN_APPROVAL_REQUEST (Story 3.4)"
      changes:
        - sql:
            sql: >-
              ALTER TABLE scos_login_approval_request
                ADD CONSTRAINT chk_login_approval_request_profile_change_kind CHECK (profile_change_kind IS NULL OR profile_change_kind IN ('SET_PRIMARY', 'ADD_ADDITIONAL'));
      rollback:
        - sql:
            sql: ALTER TABLE scos_login_approval_request DROP CONSTRAINT IF EXISTS chk_login_approval_request_profile_change_kind;
