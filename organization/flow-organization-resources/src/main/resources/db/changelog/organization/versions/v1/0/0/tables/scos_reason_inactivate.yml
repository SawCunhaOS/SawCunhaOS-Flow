databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-007
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_REASON_INACTIVATE"
      changes:
        - createTable:
            tableName: SCOS_REASON_INACTIVATE
            columns:
              - column:
                  name: REASON_INACTIVATE_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_REASON_INACTIVATE
                    nullable: false
              - column:
                  name: CODE
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: ENTITY_TYPE
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: SCOS_REASON_INACTIVATE
            columnNames: CODE, ENTITY_TYPE
            constraintName: UK_CODE_ENTITY_TYPE_SCOS_REASON_INACTIVATE
            validate: true
      rollback:
        - dropTable:
            tableName: SCOS_REASON_INACTIVATE
            cascadeConstraints: true
