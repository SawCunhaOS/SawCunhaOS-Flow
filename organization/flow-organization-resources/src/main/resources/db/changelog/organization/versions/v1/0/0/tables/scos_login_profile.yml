databaseChangeLog:
  - changeSet:
      id: 20260701-Samuel.Cunha-015
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_LOGIN_PROFILE"
      changes:
        - createTable:
            tableName: SCOS_LOGIN_PROFILE
            columns:
              - column:
                  name: LOGIN_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_LOGIN_ID_SCOS_LOGIN_PROFILE
                    references: SCOS_LOGIN(LOGIN_ID)
              - column:
                  name: PROFILE_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_PROFILE_ID_SCOS_LOGIN_PROFILE
                    references: SCOS_PROFILE(PROFILE_ID)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: SCOS_LOGIN_PROFILE
            columnNames: LOGIN_ID, PROFILE_ID
            constraintName: PK_SCOS_LOGIN_PROFILE
        - createIndex:
            tableName: SCOS_LOGIN_PROFILE
            indexName: IDX_LOGIN_PROFILE_PROFILE_ID
            columns:
              - column:
                  name: PROFILE_ID
      rollback:
        - dropTable:
            tableName: SCOS_LOGIN_PROFILE
            cascadeConstraints: true
