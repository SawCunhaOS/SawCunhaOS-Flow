databaseChangeLog:
  - changeSet:
      id: 20260718-Samuel.Cunha-003
      author: Samuel.Cunha
      comment: "Criação da tabela SCOS_SHIFT_ENFORCEMENT_LOG (Etapa 1 — auditoria imutável de bloqueio de turno, FR-11)"
      changes:
        - createTable:
            tableName: SCOS_SHIFT_ENFORCEMENT_LOG
            schemaName: scos
            columns:
              - column:
                  name: SHIFT_ENFORCEMENT_LOG_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_SCOS_SHIFT_ENFORCEMENT_LOG
                    nullable: false
              - column:
                  name: LOGIN_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_LOGIN_ID_SCOS_SHIFT_ENFORCEMENT_LOG
                    references: scos.SCOS_LOGIN(LOGIN_ID)
              - column:
                  name: EMPLOYEE_ID
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: FK_EMPLOYEE_ID_SCOS_SHIFT_ENFORCEMENT_LOG
                    references: scos.SCOS_EMPLOYEE(EMPLOYEE_ID)
              - column:
                  name: ENDPOINT
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: HTTP_METHOD
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: DECISION
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: WITHIN_SCHEDULE
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: ALLOWED_VIA
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: REQUEST_TIMESTAMP
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: USER_AT
                  type: varchar(255)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: SCOS_SHIFT_ENFORCEMENT_LOG
            schemaName: scos
            indexName: IDX_LOGIN_ID_SCOS_SHIFT_ENFORCEMENT_LOG
            columns:
              - column:
                  name: LOGIN_ID
      rollback:
        - dropTable:
            tableName: SCOS_SHIFT_ENFORCEMENT_LOG
            schemaName: scos
            cascadeConstraints: true
