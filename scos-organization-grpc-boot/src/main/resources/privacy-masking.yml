scos:
  privacy:
    masking:
      builtins:
        enabled: [ generic, br ]          # country/region packs
        disabled: [ br.titulo-eleitor ]   # turn a single item off
      headers:
        - key: authorization
          strategy: fixed
          value: "***"
      body:
        - key: taxIdentifier
          strategy: partial
          keep-first: 0
          keep-last: 2
        - key: email
          strategy: email
      log-patterns:
        # CNPJ (formatado, numérico de 14 dígitos, e alfanumérico 8+6). SEM âncoras ^$ para casar
        # o token onde quer que apareça na mensagem; os lookarounds evitam cortar uma sequência maior.
        - regex: '(?<![A-Za-z0-9])([A-Za-z0-9]{2}\.[A-Za-z0-9]{3}\.[A-Za-z0-9]{3}\/\d{4}-\d{2}|\d{14}|[A-Za-z0-9]{8}\d{6})(?![A-Za-z0-9])'
          strategy: partial
          keep-first: 3
          keep-last: 2
      audit-encrypt-fields:
        - cpf
        - email