databaseChangeLog:
  - changeSet:
      id: create_IFA_STATE
      author: Samuel Cunha
      changes:
        - tagDatabase:
            tag: INIT
        - createTable:
            tableName: IFA_STATE
            dbms: 'mysql, postgresql'
            columns:
              - column:
                  name: STATE_ID
                  autoIncrement: true
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_IFA_STATE
                    nullable: false
              - column:
                  name: NAME
                  autoIncrement: false
                  type: VARCHAR(255)
                  remarks: Represents the name of the State
                  constraints:
                    nullable: false
              - column:
                  name: ACRONYM
                  autoIncrement: false
                  type: VARCHAR(15)
                  remarks: Represents the Acronym of the State
                  constraints:
                    nullable: false
              - column:
                  name: DESCRIPTION
                  autoIncrement: false
                  type: VARCHAR(255)
                  remarks: A brief description for the line or additional information
                  constraints:
                    nullable: true
              - column:
                  name: CODE
                  autoIncrement: false
                  type: INT
                  remarks: 'Represents the State Code (Ex Brazil: IBGE)'
                  constraints:
                    nullable: true
              - column:
                  name: COUNTRY_ID
                  autoIncrement: false
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_COUNTRY_ID_IFA_STATE
                    validateForeignKey: true
                    referencedColumnNames: COUNTRY_ID
                    referencedTableName: IFA_COUNTRY
              - column:
                  name: MIGRATION_ID
                  autoIncrement: false
                  type: VARCHAR(255)
                  remarks: Informs the migration id
                  constraints:
                    nullable: true
        - renameSequence:
              oldSequenceName: ifa_state_state_id_seq
              newSequenceName: SEQ_STATE_ID
        - addUniqueConstraint:
            columnNames: NAME
            constraintName: UK_NAME_IFA_STATE
            tableName: IFA_STATE
            validate: true
        - addUniqueConstraint:
            columnNames: ACRONYM
            constraintName: UK_ACRONYM_IFA_STATE
            tableName: IFA_STATE
            validate: true
        - addUniqueConstraint:
            columnNames: CODE
            constraintName: UK_CODE_IFA_STATE
            tableName: IFA_STATE
            validate: true
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: IFA_STATE
