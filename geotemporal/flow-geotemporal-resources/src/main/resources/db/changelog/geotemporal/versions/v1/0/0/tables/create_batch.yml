databaseChangeLog:
  - changeSet:
      id: 1
      author: Samuel.Cunha
      changes:
        - createTable:
            tableName: IFA_BATCH_JOB_INSTANCE
            columns:
              - column:
                  name: JOB_INSTANCE_ID
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: VERSION
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: JOB_NAME
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: JOB_KEY
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: IFA_BATCH_JOB_INSTANCE
            columnNames: JOB_NAME, JOB_KEY
            constraintName: UK_IFA_BATCH_JOB_INSTANCE_JOB_NAME_JOB_KEY
  
  - changeSet:
      id: 2
