                  constraints:
                    nullable: false
              - column:
                  name: START_TIME
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: END_TIME
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: STATUS
