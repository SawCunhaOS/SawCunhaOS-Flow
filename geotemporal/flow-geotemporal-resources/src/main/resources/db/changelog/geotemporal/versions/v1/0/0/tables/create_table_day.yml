databaseChangeLog:
  - changeSet:
      id: create_IFA_DAY
      author: Samuel Cunha
      changes:
        - tagDatabase:
            tag: INIT
        - createTable:
            tableName: IFA_DAY
            dbms: 'postgresql'
            columns:
              - column:
                  name: DAY_ID
                  autoIncrement: true
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_IFA_DAY
                    nullable: false
              - column:
                  name: DATE
                  autoIncrement: false
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: WEEKEND
                  autoIncrement: false
                  type: ${typeBoolean}
                  constraints:
                    nullable: false
              - column:
                  name: HOLIDAY
                  autoIncrement: false
                  type: ${typeBoolean}
                  constraints:
                    nullable: false
              - column:
                  name: DAY_OF_WEEK
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: DAY_OF_YEAR
                  type: BIGINT
                  constraints:
                    nullable: false
        - renameSequence:
              oldSequenceName: ifa_day_day_id_seq
              newSequenceName: SEQ_DAY_ID
        - addUniqueConstraint:
            columnNames: DATE
            constraintName: UK_DATE_IFA_DAY
            tableName: IFA_DAY
            validate: true
        - createIndex:
            clustered: true
            indexName: IDX_IFA_DATE_OF_WEEK
            tableName: IFA_DAY
            dbms: 'postgresql'
            columns:
              - column:
                  name: DAY_OF_WEEK
        - createIndex:
            clustered: true
            indexName: IDX_IFA_DATE_WEEKEND
            tableName: IFA_DAY
            dbms: 'postgresql'
            columns:
              - column:
                  name: DATE
              - column:
                  name: WEEKEND
        - createIndex:
            clustered: true
            indexName: IDX_IFA_DATE_HOLIDAY
            tableName: IFA_DAY
            dbms: 'postgresql'
            columns:
              - column:
                  name: DATE
              - column:
                  name: HOLIDAY
        - createIndex:
            clustered: true
            indexName: IDX_DD_DATE
            tableName: IFA_DAY
            dbms: 'postgresql'
            columns:
              - column:
                  name: DATE
        - createIndex:
            clustered: true
            indexName: IDX_DD_DATE_WEEKEND_HOLIDAY
            tableName: IFA_DAY
            dbms: 'postgresql'
            columns:
              - column:
                  name: DATE
              - column:
                  name: WEEKEND
              - column:
                  name: HOLIDAY
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: IFA_DAY
