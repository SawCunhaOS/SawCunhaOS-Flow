networks:
  scos_network:
    name: scos_network
    driver: bridge

services:
  redis:
    image: redis:8.10.1-alpine
    hostname: redis
    container_name: redis-standalone
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --io-threads 4
      --io-threads-do-reads yes
      --appendonly yes
    healthcheck:
      # Usando a flag nativa do redis-cli para autenticação e checagem simples
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scos_network
    ports:
      - '6379:6379'
