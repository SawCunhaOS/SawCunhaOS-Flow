networks:
  scos_network:
    name: scos_network
    driver: bridge

services:
  redis:
    image: redis:8.8-alpine
    hostname: redis
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512MB
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --io-threads 4
      --io-threads-do-reads yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -c PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scos_network
    ports:
      - '6379:6379'

  redis-sentinel:
    image: redis:8.8-alpine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256MB
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_MASTER_HOST=redis
      - REDIS_MASTER_PORT=6379
      - REDIS_MASTER_SET=scos_master
      - REDIS_DOWN_AFTER_MS=5000
      - REDIS_FAILOVER_TIMEOUT=30000
    entrypoint: /sentinel-entrypoint.sh
    volumes:
      - ./redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -c PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - '26379:26379'
    networks:
      - scos_network
