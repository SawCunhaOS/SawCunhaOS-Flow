      tags: [City]
      summary: Get all cities
      description: UC-015 - Lista todas as cidades com paginação, opcionalmente filtradas por estado
      operationId: getAllCities
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '../ScosComponents.yml#/components/parameters/state'
        - $ref: '#/components/parameters/activeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCitiesResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_CITY]
      x-cache: [SCOS_GEOTEMPORAL_CITY]
    post:
      tags: [City]
      summary: Create a city
      description: UC-016 - Cadastra uma nova cidade vinculada a um estado
      operationId: createCity
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCityRequest'
        x-jdempotentrequestpayload: true
      responses:
