      x-cache: [SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_HOLIDAY, SCOS_GEOTEMPORAL_DAY, SCOS_GEOTEMPORAL_WORKING]

  /v1/cities:
