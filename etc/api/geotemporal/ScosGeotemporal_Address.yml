      x-authorize: [DISABLE_CITY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_INACTIVATE_CITY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/cities/{id}/holidays/link:
    put:
      tags: [City]
      summary: Link holidays to city
      description: UC-021 - Vincula um lote de feriados à cidade, tornando-os feriados municipais
      operationId: linkHolidaysToCity
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
