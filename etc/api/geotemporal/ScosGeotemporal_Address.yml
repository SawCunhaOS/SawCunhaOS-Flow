      x-authorize: [ENABLE_CITY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_ACTIVATE_CITY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/cities/{id}/disable:
