components:
  securitySchemes:
    BearerAuth:
      $ref: '../ScosComponents.yml#/components/securitySchemes/BearerAuth'
  parameters:
    activeFilter:
      name: active
      in: query
      required: false
      schema:
        type: boolean
    limitFilter:
      name: limit
      in: query
      required: false
      description: Número máximo de resultados retornados pela busca incremental
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 10
        x-min-message: SCOS_VALIDATION_002
        x-max-message: SCOS_VALIDATION_004
  schemas:
    Country:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        acronym:
          type: string
          description: Código ISO 3166-1 alpha-2 ou alpha-3 - ex. BR, BRA
        code:
          type: integer
          format: int32
          description: Código numérico ISO 3166-1
        description:
          type: string
        timeZone:
          type: string
          description: Fuso horário IANA aplicado na resolução da data corrente - ex. America/Sao_Paulo
        active:
          type: boolean
    CreateCountryRequest:
      required: [name, description, acronym, code]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        acronym:
          maxLength: 10
          minLength: 2
          type: string
          description: Código ISO 3166-1 alpha-2 ou alpha-3 - ex. BR, BRA
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
        code:
          type: integer
          format: int32
          x-required-message: SCOS_VALIDATION_003
        timeZone:
          type: string
          description: Fuso horário IANA - ex. America/Sao_Paulo. Herdado do nível superior quando ausente
    UpdateCountryRequest:
      required: [name, description, acronym, code]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        acronym:
          maxLength: 10
          minLength: 2
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
        code:
          type: integer
          format: int32
          x-required-message: SCOS_VALIDATION_003
        timeZone:
          type: string
          description: Fuso horário IANA - ex. America/Sao_Paulo. Herdado do nível superior quando ausente
    GetCountryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Country'
    GetAllCountriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Country'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'

