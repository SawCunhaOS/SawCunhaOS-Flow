        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_STATE]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_INACTIVATE_STATE
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/states/{id}/holidays/link:
    put:
      tags: [State]
      summary: Link holidays to state
      description: UC-013 - Vincula um lote de feriados ao estado, tornando-os feriados estaduais
      operationId: linkHolidaysToState
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ScosGeotemporal_Day.yml#/components/schemas/HolidayLinkRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [LINK_STATE_HOLIDAY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_LINK_STATE_HOLIDAY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_HOLIDAY, SCOS_GEOTEMPORAL_DAY, SCOS_GEOTEMPORAL_WORKING]

  /v1/states/{id}/holidays/unlink:
    put:
      tags: [State]
      summary: Unlink holidays from state
      description: UC-014 - Desvincula um lote de feriados do estado
      operationId: unlinkHolidaysFromState
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
