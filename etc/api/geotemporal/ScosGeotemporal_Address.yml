      operationId: activateCity
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
