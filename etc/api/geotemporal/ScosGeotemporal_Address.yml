          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllStatesResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_STATE]
      x-cache: [SCOS_GEOTEMPORAL_STATE]
    post:
      tags: [State]
      summary: Create a state
      description: UC-008 - Cadastra um novo estado vinculado a um país
      operationId: createState
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStateRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: '../ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_STATE]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_CREATE_STATE
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_STATE]

  /v1/states/{id}:
    get:
      tags: [State]
      summary: Get state by id
      description: UC-009 - Retorna um estado pelo identificador
      operationId: getStateById
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStateResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_STATE]
      x-cache: [SCOS_GEOTEMPORAL_STATE]
    put:
      tags: [State]
      summary: Update state
      description: UC-010 - Atualiza os dados de um estado existente
      operationId: updateState
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStateRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_STATE]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_UPDATE_STATE
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/states/{id}/enable:
    put:
      tags: [State]
      summary: Activate state
      description: UC-011 - Reativa state com active=false
      operationId: activateState
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
