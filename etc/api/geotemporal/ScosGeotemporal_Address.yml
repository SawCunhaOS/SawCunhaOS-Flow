        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_CITY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_CREATE_CITY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_CITY]

  /v1/cities/{id}:
