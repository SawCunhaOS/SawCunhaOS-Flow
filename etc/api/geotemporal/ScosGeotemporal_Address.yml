      x-authorize: [ENABLE_STATE]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_ACTIVATE_STATE
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/states/{id}/disable:
    put:
