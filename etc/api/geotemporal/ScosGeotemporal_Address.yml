openapi: 3.0.3
info:
  title: SawCunhaOS Geotemporal - Address
  description: APIs para gestão da hierarquia geográfica e de endereços do sistema SCOS.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /geotemporal/api
tags:
  - name: Country
    description: APIs para gestão dos países
  - name: State
    description: APIs para gestão dos estados
  - name: City
    description: APIs para gestão das cidades
  - name: District
    description: APIs para gestão dos bairros
  - name: Street Type
    description: APIs para gestão dos tipos de logradouro
  - name: Address
    description: APIs para gestão dos endereços

paths:
  /v1/countries:
    get:
      tags: [Country]
      summary: Get all countries
      description: UC-001 - Lista todos os países com paginação
      operationId: getAllCountries
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/activeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCountriesResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COUNTRY]
      x-cache: [SCOS_GEOTEMPORAL_COUNTRY]
    post:
      tags: [Country]
      summary: Create a country
      description: UC-002 - Cadastra um novo país
      operationId: createCountry
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCountryRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: '../ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_COUNTRY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_CREATE_COUNTRY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_COUNTRY]

  /v1/countries/{id}:
    get:
      tags: [Country]
      summary: Get country by id
      description: UC-003 - Retorna um país pelo identificador
      operationId: getCountryById
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCountryResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COUNTRY]
      x-cache: [SCOS_GEOTEMPORAL_COUNTRY]
    put:
      tags: [Country]
      summary: Update country
      description: UC-004 - Atualiza os dados de um país existente
      operationId: updateCountry
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCountryRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_COUNTRY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_UPDATE_COUNTRY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_COUNTRY, SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/countries/{id}/enable:
    put:
      tags: [Country]
      summary: Activate country
      description: UC-005 - Reativa country com active=false
      operationId: activateCountry
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_COUNTRY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_ACTIVATE_COUNTRY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_COUNTRY, SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/countries/{id}/disable:
    put:
      tags: [Country]
      summary: Inactivate country
      description: UC-006 - Inativa country com active=true
      operationId: inactivateCountry
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_COUNTRY]
      x-jdempotentresource:
        cachePrefix: SCOS_GEOTEMPORAL_IDP_INACTIVATE_COUNTRY
        ttl: 1
      x-cache: [SCOS_GEOTEMPORAL_COUNTRY, SCOS_GEOTEMPORAL_STATE, SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_DISTRICT, SCOS_GEOTEMPORAL_ADDRESS]

  /v1/states:
    get:
      tags: [State]
      summary: Get all states
      description: UC-007 - Lista todos os estados com paginação, opcionalmente filtrados por país
      operationId: getAllStates
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '../ScosComponents.yml#/components/parameters/country'
