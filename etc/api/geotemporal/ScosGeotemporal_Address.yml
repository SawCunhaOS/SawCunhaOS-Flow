      x-cache: [SCOS_GEOTEMPORAL_CITY, SCOS_GEOTEMPORAL_HOLIDAY, SCOS_GEOTEMPORAL_DAY, SCOS_GEOTEMPORAL_WORKING]

  /v1/cities/{id}/holidays/unlink:
    put:
      tags: [City]
      summary: Unlink holidays from city
      description: UC-022 - Desvincula um lote de feriados da cidade
      operationId: unlinkHolidaysFromCity
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
