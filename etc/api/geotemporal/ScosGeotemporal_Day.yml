components:
  securitySchemes:
    BearerAuth:
      $ref: '../ScosComponents.yml#/components/securitySchemes/BearerAuth'
  schemas:
    TypeHoliday:
      type: string
      enum:
        - OPTIONAL
        - HALF_PERIOD
        - MANDATORY

    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
    CreateTagRequest:
      required: [code, description]
      type: object
      properties:
        code:
          maxLength: 20
          minLength: 1
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
    UpdateTagRequest:
      required: [code, description]
      type: object
      properties:
        code:
          maxLength: 20
          minLength: 1
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
    GetTagResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tag'
    GetAllTagsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'

    TagLinkRequest:
      required: [tagIds]
      type: object
      properties:
        tagIds:
          maxItems: 50
          minItems: 1
          type: array
          description: Identificadores dos marcadores a vincular ou desvincular
          items:
            type: integer
            format: int64
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
    TagCriteriaRequest:
      required: [tagIds, year]
      type: object
      description: Critério de seleção dos dias. Ao menos um entre dayOfWeek, dayOfYear ou day/month deve ser informado
      properties:
        tagIds:
          maxItems: 50
          minItems: 1
          type: array
          items:
            type: integer
            format: int64
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
        dayOfWeek:
          $ref: '../ScosComponents.yml#/components/schemas/DayOfWeek'
        dayOfYear:
          type: integer
          format: int32
          minimum: 1
          maximum: 366
          x-min-message: SCOS_VALIDATION_002
          x-max-message: SCOS_VALIDATION_004
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          x-min-message: SCOS_VALIDATION_002
          x-max-message: SCOS_VALIDATION_004
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          x-min-message: SCOS_VALIDATION_002
          x-max-message: SCOS_VALIDATION_004
        year:
          type: integer
          format: int32
          description: Ano alvo. Deve estar dentro da janela definida por LIMIT_BACK_DAYS_YEARS e LIMIT_FORWARD_DAYS_YEARS
          x-required-message: SCOS_VALIDATION_003
    BatchRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          description: Identificador do processamento assíncrono agendado
    BatchRequestResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BatchRequest'

    Day:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        weekend:
          type: boolean
        holiday:
          type: boolean
        dayOfWeek:
          $ref: '../ScosComponents.yml#/components/schemas/DayOfWeek'
        dayOfYear:
          type: integer
          format: int32
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    GetDayResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Day'
    GetAllDaysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Day'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'

    Holiday:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        holidayType:
          $ref: '#/components/schemas/TypeHoliday'
        fromTime:
          type: string
          format: time
          description: Hora de início do feriado quando holidayType é HALF_PERIOD
        day:
          type: string
          format: date
        optional:
          type: boolean
        nationalHoliday:
          type: boolean
    CreateHolidayRequest:
      required: [name, description, holidayType, optional, nationalHoliday, dayId]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        holidayType:
          allOf:
            - $ref: '#/components/schemas/TypeHoliday'
          x-required-message: SCOS_VALIDATION_003
        fromTime:
          type: string
          format: time
          description: Obrigatório quando holidayType é HALF_PERIOD
        optional:
          type: boolean
          default: false
          x-required-message: SCOS_VALIDATION_003
        nationalHoliday:
          type: boolean
          default: false
          x-required-message: SCOS_VALIDATION_003
        dayId:
          type: integer
          format: int64
          description: Identificador do dia do calendário ao qual o feriado será vinculado
          x-required-message: SCOS_VALIDATION_003
    UpdateHolidayRequest:
      required: [name, description, holidayType, optional, nationalHoliday]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        holidayType:
          allOf:
            - $ref: '#/components/schemas/TypeHoliday'
          x-required-message: SCOS_VALIDATION_003
        fromTime:
          type: string
          format: time
          description: Obrigatório quando holidayType é HALF_PERIOD
        optional:
          type: boolean
          default: false
          x-required-message: SCOS_VALIDATION_003
        nationalHoliday:
          type: boolean
          default: false
          x-required-message: SCOS_VALIDATION_003
    HolidayLinkRequest:
      required: [holidayIds]
      type: object
      properties:
        holidayIds:
          maxItems: 50
          minItems: 1
          type: array
          description: Identificadores dos feriados a vincular ou desvincular do estado ou da cidade
          items:
            type: integer
            format: int64
          x-required-message: SCOS_VALIDATION_003
          x-size-message: SCOS_VALIDATION_008
          x-empty-message: SCOS_VALIDATION_001
    GetHolidayResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Holiday'
    GetAllHolidaysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'

    FixedHoliday:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        day:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
        optional:
          type: boolean
        enabled:
          type: boolean
        fromTime:
          type: string
          format: time
        countryId:
          type: integer
          format: int64
        countryName:
          type: string
    CreateFixedHolidayRequest:
      required: [name, description, day, month, optional, enabled, countryId]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          x-required-message: SCOS_VALIDATION_003
          x-min-message: SCOS_VALIDATION_002
          x-max-message: SCOS_VALIDATION_004
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          x-required-message: SCOS_VALIDATION_003
          x-min-message: SCOS_VALIDATION_002
          x-max-message: SCOS_VALIDATION_004
        optional:
          type: boolean
          default: false
          x-required-message: SCOS_VALIDATION_003
        fromTime:
          type: string
          format: time
        enabled:
          type: boolean
          default: true
          x-required-message: SCOS_VALIDATION_003
        countryId:
          type: integer
          format: int64
          description: País ao qual o feriado fixo pertence
          x-required-message: SCOS_VALIDATION_003
    UpdateFixedHolidayRequest:
      required: [name, description, optional, enabled]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        optional:
          type: boolean
          default: false
          x-required-message: SCOS_VALIDATION_003
        fromTime:
          type: string
          format: time
        enabled:
          type: boolean
          default: true
          x-required-message: SCOS_VALIDATION_003
    GetFixedHolidayResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FixedHoliday'
    GetAllFixedHolidaysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FixedHoliday'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'

    WorkingDay:
      type: object
      properties:
        date:
          type: string
          format: date
        workingDay:
          type: boolean
        weekend:
          type: boolean
        holiday:
          type: boolean
    GetWorkingDayResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WorkingDay'

security:
  - BearerAuth: []
