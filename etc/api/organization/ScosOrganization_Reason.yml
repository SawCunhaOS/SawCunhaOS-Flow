components:
  securitySchemes:
    BearerAuth:
      $ref: './ScosComponents.yml#/components/securitySchemes/BearerAuth'
  parameters:
    entityTypeFilter:
      name: entityType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ReasonEntityType'
  schemas:
    ReasonEntityType:
      type: string
      enum:
        - COMPANY
        - EMPLOYEE
        - LOGIN
    ReasonActivate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        entityType:
          $ref: '#/components/schemas/ReasonEntityType'
        active:
          type: boolean
    GetReasonActivateResponse:
