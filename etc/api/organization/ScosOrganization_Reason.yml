openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Reason
  description: APIs para gestão dos catálogos de motivo de transição de status (ativação/inativação/bloqueio/desbloqueio), compartilhados entre Company, Employee e Login.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: ReasonActivate
    description: APIs para gestão do catálogo de motivo de ativação
  - name: ReasonInactivate
    description: APIs para gestão do catálogo de motivo de inativação
  - name: ReasonDisable
    description: APIs para gestão do catálogo de motivo de bloqueio
  - name: ReasonEnable
    description: APIs para gestão do catálogo de motivo de desbloqueio

paths:
  /v1/reason-activate:
    get:
      tags: [ReasonActivate]
      summary: Get all ReasonActivate entries
      description: UC-113 - Lista todos os motivos de ativação com paginação. Pode filtrar por entityType
