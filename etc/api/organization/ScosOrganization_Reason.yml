      x-authorize: [CREATE_REASON_ACTIVATE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_REASON_ACTIVATE
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_REASON_ACTIVATE]

  /v1/reason-activate/{id}:
