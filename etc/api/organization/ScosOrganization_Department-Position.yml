components:
  schemas:
    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
    GetDepartmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Department'
    GetAllDepartmentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        PaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateDepartmentRequest:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    UpdateDepartmentRequest:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    
    Position:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
        department:
          $ref: '#/components/schemas/Department'
    GetPositionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Position'
    GetAllPositionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        PaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreatePositionRequest:
      required:
        - code
        - description
        - departmentId
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        departmentId:
          type: integer
          format: int64
          x-required-message: SCOS-003
    UpdatePositionRequest:
      required:
        - code
        - description
        - departmentId
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        departmentId:
          type: integer
          format: int64
          x-required-message: SCOS-003