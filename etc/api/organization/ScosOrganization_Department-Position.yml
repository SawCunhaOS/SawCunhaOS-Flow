openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Department and Position
  description: APIs para gestão de departamentos e cargos.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: Department
    description: APIs para registro e atualização dos departamentos
  - name: Position
    description: APIs para registro e atualização dos cargos nos departamentos
  - name: Reason Position Change
    description: APIs para gestão do catálogo de motivos de mudança de cargo

paths:
  /v1/departments:
    get:
      tags: [Department]
      summary: Get all departments
      description: UC-022 - Lista todos os departamentos com paginação
      operationId: getAllDepartments
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/activeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDepartmentsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_DEPARTMENT]
    post:
      tags: [Department]
      summary: Create a department
      description: UC-021 - Cria um novo departamento
      operationId: createDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_DEPARTMENT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_CREATE_DEPARTMENT
        ttl: 1

  /v1/departments/{id}:
    get:
      tags: [Department]
      summary: Get department by id
      description: UC-023 - Retorna os dados de um departamento
      operationId: getDepartmentById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDepartmentResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_DEPARTMENT]
    put:
      tags: [Department]
      summary: Update department
      description: UC-024 - Atualiza o código, descrição e o Gerente do Departamento (managerId, opcional - null remove o gerente atual)
      operationId: updateDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_DEPARTMENT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_UPDATE_DEPARTMENT
        ttl: 1

  /v1/departments/{id}/enable:
    put:
      tags: [Department]
      summary: Activate department
      description: UC-025 - Reativa departamento com status INACTIVE
      operationId: activateDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_DEPARTMENT]

  /v1/departments/{id}/disable:
    put:
      tags: [Department]
      summary: Inactivate department
      description: UC-026 - Inativa departamento com status ACTIVE
      operationId: inactivateDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_DEPARTMENT]

  /v1/positions:
    get:
      tags: [Position]
      summary: Get all positions
      description: UC-029 - Lista todos os cargos com paginação. Pode filtrar por departamento
      operationId: getAllPositions
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/departmentIdFilter'
        - $ref: '#/components/parameters/activeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllPositionsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_POSITION]
    post:
      tags: [Position]
      summary: Create a position
      description: UC-028 - Cria um cargo vinculado a um departamento ativo
      operationId: createPosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_POSITION]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_CREATE_POSITION
        ttl: 1

  /v1/positions/{id}:
    get:
      tags: [Position]
      summary: Get position by id
      description: UC-030 - Retorna os dados de um cargo incluindo o departamento
      operationId: getPositionById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPositionResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_POSITION]
    put:
      tags: [Position]
      summary: Update position
      description: UC-031 - Atualiza o código, descrição ou departamento de um cargo
      operationId: updatePosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_POSITION]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_UPDATE_POSITION
        ttl: 1

  /v1/positions/{id}/enable:
    put:
      tags: [Position]
      summary: Activate position
      description: UC-032 - Reativa cargo com status INACTIVE
      operationId: activatePosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_POSITION]

  /v1/positions/{id}/disable:
    put:
      tags: [Position]
      summary: Inactivate position
      description: UC-033 - Inativa cargo com status ACTIVE
      operationId: inactivatePosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_POSITION]

  /v1/reason-position-change:
    get:
      tags: [Reason Position Change]
      summary: Get all reason position changes
      description: UC-106 - Lista todos os motivos de mudança de cargo com paginação
      operationId: getAllReasonPositionChange
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllReasonPositionChangeResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_REASON_POSITION_CHANGE]
    post:
      tags: [Reason Position Change]
      summary: Create a reason position change
      description: UC-107 - Cria um novo motivo de mudança de cargo
      operationId: createReasonPositionChange
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReasonPositionChangeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_REASON_POSITION_CHANGE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_CREATE_REASON_POSITION_CHANGE
        ttl: 1

  /v1/reason-position-change/{id}:
    get:
      tags: [Reason Position Change]
      summary: Get reason position change by id
      description: UC-108 - Retorna os dados de um motivo de mudança de cargo
      operationId: getReasonPositionChangeById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReasonPositionChangeResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_REASON_POSITION_CHANGE]
    put:
      tags: [Reason Position Change]
      summary: Update reason position change
      description: UC-109 - Atualiza o código ou descrição de um motivo de mudança de cargo
      operationId: updateReasonPositionChange
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReasonPositionChangeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_REASON_POSITION_CHANGE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_UPDATE_REASON_POSITION_CHANGE
        ttl: 1

  /v1/reason-position-change/{id}/enable:
    put:
      tags: [Reason Position Change]
      summary: Activate reason position change
      description: UC-110 - Reativa motivo de mudança de cargo com active=false
      operationId: activateReasonPositionChange
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_REASON_POSITION_CHANGE]

  /v1/reason-position-change/{id}/disable:
    put:
      tags: [Reason Position Change]
      summary: Inactivate reason position change
      description: UC-111 - Inativa motivo de mudança de cargo com active=true
      operationId: inactivateReasonPositionChange
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_REASON_POSITION_CHANGE]

  /v1/positions/{positionId}/work-schedule:
    get:
      tags: [Position]
      summary: Get position work schedule
      description: >-
        UC-144 - Lista a jornada de trabalho template do cargo, um item por dia da semana cadastrado.
        Retorna array direto, sem paginação - a UK composta (positionId, dayOfWeek) garante teto real de 7 registros
      operationId: getAllPositionWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idPosition'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllPositionWorkScheduleResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_POSITION_WORK_SCHEDULE]
    post:
      tags: [Position]
      summary: Create position work schedule
      description: UC-145 - Cria o horário de um dia da semana do template do cargo. Rejeitado se já existir registro para esse (positionId, dayOfWeek)
      operationId: createPositionWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idPosition'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionWorkScheduleRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_POSITION_WORK_SCHEDULE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_CREATE_POSITION_WORK_SCHEDULE
        ttl: 1

  /v1/positions/{positionId}/work-schedule/{dayOfWeek}:
    put:
      tags: [Position]
      summary: Update position work schedule
      description: UC-146 - Atualiza o horário de um dia da semana já cadastrado no template do cargo
      operationId: updatePositionWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idPosition'
        - $ref: '#/components/parameters/dayOfWeekPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionWorkScheduleRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_POSITION_WORK_SCHEDULE]
    delete:
      tags: [Position]
      summary: Delete position work schedule
      description: UC-147 - Remove o horário de um dia da semana do template do cargo
      operationId: deletePositionWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idPosition'
        - $ref: '#/components/parameters/dayOfWeekPath'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_POSITION_WORK_SCHEDULE]

components:
  securitySchemes:
    BearerAuth:
      $ref: './ScosComponents.yml#/components/securitySchemes/BearerAuth'
  parameters:
    activeFilter:
      name: active
      in: query
      required: false
      schema:
        type: boolean
    departmentIdFilter:
      name: departmentId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    idPosition:
      name: positionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    dayOfWeekPath:
      name: dayOfWeek
      in: path
      required: true
      schema:
        $ref: './ScosComponents.yml#/components/schemas/DayOfWeek'
      x-jdempotentrequestpayload: true
  schemas:
    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
        managerId:
          type: integer
          format: int64
          nullable: true
          description: Funcionário resolvido como Gerente do Departamento - nível MANAGER da cadeia de aprovação de Login (Story 3.2)
    GetDepartmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Department'
    GetAllDepartmentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateDepartmentRequest:
      required: [code, description]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
    UpdateDepartmentRequest:
      required: [code, description]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        managerId:
          type: integer
          format: int64
          nullable: true
          description: Define/troca o Gerente do Departamento. Omitido ou null remove o gerente atual
    Position:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
        isTrustPosition:
          type: boolean
          default: false
        department:
          $ref: '#/components/schemas/Department'
    GetPositionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Position'
    GetAllPositionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreatePositionRequest:
      required: [code, description, departmentId]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        departmentId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
        isTrustPosition:
          type: boolean
          default: false
    UpdatePositionRequest:
      required: [code, description, departmentId]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        departmentId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
        isTrustPosition:
          type: boolean
          default: false
    ReasonPositionChange:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
