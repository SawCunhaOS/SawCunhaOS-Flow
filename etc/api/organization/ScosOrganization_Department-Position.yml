openapi: 3.0.3
info:
  title: Inside Flow Partners - Department and Position
  description: The Inside Flow Partners system contains APIs to use in partners management.
  termsOfService: http://licencas.softwarelivre.org/gpl-3.0.pt-br.html
  contact:
    name: Samuel Cunha
    url: https://github.com/InsideSoftwares
    email: samuel.cunha@insidesoftwares.com.br
  license:
    name: License - GNU
    url: http://licencas.softwarelivre.org/gpl-3.0.pt-br.html
  version: '1.0'
servers:
  - url: /insideflow/partners/api
    description: Generated server url
tags:
  - name: Department
    description: APIs para registro e atualização dos departamentos
  - name: Position
    description: APIs para registro e atualização dos cargos nos departamentos

paths:
  /v1/departments:
    get:
      tags:
        - Department
      summary: Get all departments
      description: Get all departments
      operationId: getAllDepartments
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllDepartmentsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_DEPARTMENT ]
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT ]
    post:
      tags:
        - Department
      summary: Create a department
      description: Create a department
      operationId: createDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ CREATE_DEPARTMENT ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_DEPARTMENT
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT, INSIDE_FLOW_PARTNERS_POSITION ]
  /v1/departments/{id}:
    get:
      tags:
        - Department
      summary: Get department by id
      description: Get department by id
      operationId: getDepartmentById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDepartmentResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_DEPARTMENT ]
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT ]
    put:
      tags:
        - Department
      summary: Update department
      description: Update department
      operationId: updateDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_DEPARTMENT ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_DEPARTMENT
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT, INSIDE_FLOW_PARTNERS_POSITION ]
    delete:
      tags:
        - Department
      summary: Delete department
      description: Delete department
      operationId: deleteDepartment
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ DELETE_DEPARTMENT ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_DEPARTMENT
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT, INSIDE_FLOW_PARTNERS_POSITION ]
  /v1/positions:
    get:
      tags:
        - Position
      summary: Get all positions
      description: Get all positions
      operationId: getAllPositions
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllPositionsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_POSITION ]
      x-cache: [ INSIDE_FLOW_PARTNERS_POSITION ]
    post:
      tags:
        - Position
      summary: Create a position
      description: Create a position
      operationId: createPosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ CREATE_POSITION ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_POSITION
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT, INSIDE_FLOW_PARTNERS_POSITION ]
  /v1/positions/{id}: 
    get:
      tags:
        - Position
      summary: Get position by id
      description: Get position by id
      operationId: getPositionById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPositionResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_POSITION ]
      x-cache: [ INSIDE_FLOW_PARTNERS_POSITION ]
    put:
      tags:
        - Position
      summary: Update position
      description: Update position
      operationId: updatePosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_POSITION ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_POSITION
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT, INSIDE_FLOW_PARTNERS_POSITION ]
    delete:
      tags:
        - Position
      summary: Delete position
      description: Delete position
      operationId: deletePosition
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ DELETE_POSITION ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_POSITION
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_DEPARTMENT, INSIDE_FLOW_PARTNERS_POSITION ]


components:
  schemas:
    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    GetDepartmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Department'
    GetAllDepartmentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateDepartmentRequest:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    UpdateDepartmentRequest:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    
    Position:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        department:
          $ref: '#/components/schemas/Department'
    GetPositionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Position'
    GetAllPositionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreatePositionRequest:
      required:
        - code
        - description
        - departmentId
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        departmentId:
          type: integer
          format: int64
          x-required-message: SCOS-003
    UpdatePositionRequest:
      required:
        - code
        - description
        - departmentId
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        departmentId:
          type: integer
          format: int64
          x-required-message: SCOS-003