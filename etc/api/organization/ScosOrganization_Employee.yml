components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idEmployee:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true

  schemas:
    Employees:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        email:
          type: string
        active:
          type: boolean
    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
        email:
          type: string
        birthDate:
          type: string
          format: date
        dateOfHiring:
          type: string
          format: date
        observation:
          type: string
        active:
          type: boolean
        supervisor:
          $ref: '#/components/schemas/Supervisor'
        company:
          $ref: '#/components/schemas/Company'
        position:
          $ref: './ScosOrganization_Department-Position.yml#/components/schemas/Position'
    Supervisor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Company:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    GetEmployeeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'
    GetAllEmployeesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employees'
        PaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateEmployeeRequest:
      required:
        - name
        - nameTreatment
        - taxIdentifier
        - email
        - birthDate
        - dateOfHiring
        - company_id
        - position_id
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        nameTreatment:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        taxIdentifier:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        email:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        birthDate:
          type: string
          format: date
          x-required-message: SCOS-003
        dateOfHiring:
          type: string
          format: date
          x-required-message: SCOS-003
        observation:
          type: string
        supervisor_id:
          type: integer
          format: int64
        company_id:
          type: integer
          format: int64
          x-required-message: SCOS-003
        position_id:
          type: integer
          format: int64
          x-required-message: SCOS-003
    UpdateEmployeeRequest:
      required:
        - name
        - nameTreatment
        - taxIdentifier
        - email
        - birthDate
        - dateOfHiring
        - company_id
        - position_id
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        nameTreatment:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        taxIdentifier:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        email:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        birthDate:
          type: string
          format: date
          x-required-message: SCOS-003
        dateOfHiring:
          type: string
          format: date
          x-required-message: SCOS-003
        observation:
          type: string
        supervisor_id:
          type: integer
          format: int64
        company_id:
          type: integer
          format: int64
          x-required-message: SCOS-003
        position_id:
          type: integer
          format: int64
          x-required-message: SCOS-003
    EmployeeContact:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        phone:
          type: string
    GetEmployeeContactResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmployeeContact'
    GetAllEmployeeContactsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeContact'
        PaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateEmployeeContactRequest:
      required:
        - type
        - phone
      type: object
      properties:
        type:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        phone:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
    UpdateEmployeeContactRequest:
      required:
        - type
        - phone
      type: object
      properties:
        type:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        phone:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
    EmployeeAddresses:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        number:
          type: number
        complement:
          type: string
    EmployeeAddress:
      type: object
      properties:
        id:
          type: integer
          format: int64
        addressId:
          type: integer
          format: int64
        address:
          type: string
        type:
          type: string
        number:
          type: number
        complement:
          type: string
        latitude:
          type: string
        longitude:
          type: string
    GetEmployeeAddressResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmployeeAddress'
    GetAllEmployeeAddressResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeAddresses'
        PaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateEmployeeAddressRequest:
      required:
        - type
        - number
        - complement
        - latitude
        - longitude
        - addressId
      type: object
      properties:
        type:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        number:
          type: string
          x-required-message: SCOS-003
          x-jdempotentrequestpayload: true
        complement:
          type: string
          x-required-message: SCOS-003
        latitude:
          type: string
          x-required-message: SCOS-003
        longitude:
          type: string
          x-required-message: SCOS-003
        addressId:
          type: integer
          format: int64
          x-required-message: SCOS-003
          x-jdempotentrequestpayload: true
    UpdateEmployeeAddressRequest:
      required:
        - type
        - number
        - complement
        - latitude
        - longitude
        - addressId
      type: object
      properties:
        type:
