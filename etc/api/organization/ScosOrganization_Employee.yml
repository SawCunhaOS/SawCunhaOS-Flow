          type: string
          format: time
    GetAllEmployeeWorkScheduleResponse:
      type: array
      description: Array direto, sem paginação - teto real de 7 registros (um por dia da semana) garantido pela UK composta (employeeId, dayOfWeek)
      items:
        $ref: '#/components/schemas/EmployeeWorkSchedule'
    CreateEmployeeWorkScheduleRequest:
      required: [dayOfWeek, startTime, lunchStart, lunchEnd, endTime]
      type: object
