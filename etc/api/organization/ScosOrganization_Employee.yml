openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Employee
  description: APIs para gestão de funcionários, hierarquia, contatos e endereços.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: Employee
    description: APIs para registro dos dados do Funcionário
  - name: Employee Contact
    description: APIs para registro dos contatos do Funcionário
  - name: Employee Address
    description: APIs para registro dos endereços do Funcionário

paths:
  /v1/employees:
    get:
      tags: [Employee]
      summary: Get all employees
      description: UC-036 - Lista todos os funcionários com paginação e filtros
      operationId: getAllEmployees
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/companyIdFilter'
        - $ref: '#/components/parameters/positionIdFilter'
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []
    post:
      tags: [Employee]
      summary: Create an employee
      description: UC-035 - Registra funcionário vinculado a cargo e empresa ativos
      operationId: createEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{id}:
    get:
      tags: [Employee]
      summary: Get employee by id
      description: UC-037 - Retorna dados completos incluindo cargo, empresa e supervisor
      operationId: getEmployeeById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []
    put:
      tags: [Employee]
      summary: Update employee
      description: UC-038 - Atualiza dados pessoais. Para empresa, cargo ou supervisor use transfer
      operationId: updateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []
    delete:
      tags: [Employee]
      summary: Delete employee
      description: UC-043 - Exclusão lógica. Registro permanece com status DISABLED
      operationId: deleteEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{id}/enable:
    put:
      tags: [Employee]
      summary: Activate employee
      description: UC-039 - Reativa funcionário com status INACTIVE
      operationId: activateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{id}/disable:
    put:
      tags: [Employee]
      summary: Inactivate employee
      description: UC-040 - Inativa funcionário. Logins vinculados são inativados e desabilitados no Keycloak via Saga
      operationId: inactivateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE, SCOS_ORGANIZATION_LOGIN, SCOS_ORGANIZATION_LOGIN_INFO]
      security:
        - BearerAuth: []

  /v1/employees/{id}/transfer:
    patch:
      tags: [Employee]
      summary: Transfer employee
      description: UC-041 - Transfere para outra empresa, filial, cargo ou supervisor. Mudança de empresa dispara Saga Keycloak TYPE=UPDATE
      operationId: transferEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [TRANSFER_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE, SCOS_ORGANIZATION_LOGIN_INFO]
      security:
        - BearerAuth: []

  /v1/employees/{id}/hierarchy:
    get:
      tags: [Employee]
      summary: Get employee hierarchy
      description: UC-042 - Retorna a cadeia de supervisores em árvore ascendente
      operationId: getEmployeeHierarchy
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeHierarchyResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{id}/subordinates:
    get:
      tags: [Employee]
      summary: Get employee subordinates
      description: UC-080 - Lista os funcionários que reportam diretamente ao funcionário informado
      operationId: getEmployeeSubordinates
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{employeeId}/contacts:
    get:
      tags: [Employee Contact]
      summary: Get all employee contacts
      description: UC-044 - Lista todos os contatos de um funcionário
      operationId: getAllEmployeeContacts
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/idEmployee'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeContactsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_CONTACT]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_CONTACT]
      security:
        - BearerAuth: []
    post:
      tags: [Employee Contact]
      summary: Create an employee contact
      description: UC-045 - Adiciona um contato telefônico ao funcionário
      operationId: createEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeContactRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE_CONTACT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE_CONTACT
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_CONTACT, SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{employeeId}/contacts/{id}:
    get:
      tags: [Employee Contact]
      summary: Get employee contact by id
      description: UC-046 - Retorna um contato específico do funcionário
      operationId: getEmployeeContactById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeContactResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_CONTACT]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_CONTACT]
      security:
        - BearerAuth: []
    put:
      tags: [Employee Contact]
      summary: Update employee contact
      description: UC-047 - Atualiza o tipo ou telefone de um contato
      operationId: updateEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeContactRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE_CONTACT]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_CONTACT, SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []
    delete:
      tags: [Employee Contact]
      summary: Delete employee contact
      description: UC-048 - Remove um contato do funcionário
      operationId: deleteEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_EMPLOYEE_CONTACT]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_CONTACT, SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{employeeId}/addresses:
    get:
      tags: [Employee Address]
      summary: Get all employee addresses
      description: UC-049 - Lista todos os endereços vinculados a um funcionário
      operationId: getAllEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/idEmployee'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeAddressResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_ADDRESS]
      security:
        - BearerAuth: []
    post:
      tags: [Employee Address]
      summary: Create an employee address
      description: UC-050 - Vincula um endereço externo ao funcionário. Integridade do addressId garantida pela aplicação
      operationId: createEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeAddressRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE_ADDRESS]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE_ADDRESS
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_ADDRESS, SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

  /v1/employees/{employeeId}/addresses/{id}:
    get:
      tags: [Employee Address]
      summary: Get employee address by id
      description: UC-051 - Retorna o vínculo de endereço do funcionário
      operationId: getEmployeeAddressById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeAddressResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_ADDRESS]
      security:
        - BearerAuth: []
    put:
      tags: [Employee Address]
      summary: Update employee address
      description: UC-052 - Atualiza os dados do vínculo. Não altera o addressId externo
      operationId: updateEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeAddressRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_ADDRESS, SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []
    delete:
      tags: [Employee Address]
      summary: Delete employee address
      description: UC-053 - Remove o vínculo de endereço. O registro externo não é afetado
      operationId: deleteEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_EMPLOYEE_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_EMPLOYEE_ADDRESS, SCOS_ORGANIZATION_EMPLOYEE]
      security:
        - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idEmployee:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    companyIdFilter:
      name: companyId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    positionIdFilter:
      name: positionId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EmployeeStatus'
  schemas:
    EmployeeStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - DISABLED
    Employees:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/EmployeeStatus'
    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
        email:
          type: string
        birthDate:
          type: string
          format: date
        dateOfHiring:
          type: string
          format: date
        observation:
          type: string
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        supervisor:
          $ref: '#/components/schemas/Supervisor'
        company:
          $ref: '#/components/schemas/EmployeeCompany'
        position:
          $ref: './ScosOrganization_Department-Position.yml#/components/schemas/Position'
    Supervisor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    EmployeeCompany:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    EmployeeHierarchyNode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        position:
          type: string
        supervisor:
          $ref: '#/components/schemas/EmployeeHierarchyNode'
    GetEmployeeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'
    GetAllEmployeesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employees'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    GetEmployeeHierarchyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmployeeHierarchyNode'
    CreateEmployeeRequest:
      required: [name, nameTreatment, taxIdentifier, email, birthDate, dateOfHiring, companyId, positionId]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        nameTreatment:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        taxIdentifier:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
          x-is-cpf: true
        email:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        birthDate:
          type: string
          format: date
          x-required-message: SCOS-003
        dateOfHiring:
          type: string
