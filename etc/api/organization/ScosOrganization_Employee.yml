        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_EMPLOYEE ]
      x-cache: [ SCOS_ORGANIZATION_EMPLOYEE ]
    put:
      tags:
        - Employee
      summary: Update employee
      description: Update employee
      operationId: updateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE ]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE
        ttl: 1
      x-cache: [ SCOS_ORGANIZATION_EMPLOYEE, SCOS_ORGANIZATION_EMPLOYEE_ADDRESS, SCOS_ORGANIZATION_EMPLOYEE_CONTACT ]
    delete:
      tags:
        - Employee
      summary: Delete employee
      description: Delete employee
      operationId: deleteEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ DELETE_EMPLOYEE ]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE
        ttl: 1
      x-cache: [ SCOS_ORGANIZATION_EMPLOYEE, SCOS_ORGANIZATION_EMPLOYEE_ADDRESS, SCOS_ORGANIZATION_EMPLOYEE_CONTACT ]
  /v1/employees/{id}/enable:
    put:
      tags:
        - Employee
      summary: Activate employee
      description: Activate employee
      operationId: activateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
