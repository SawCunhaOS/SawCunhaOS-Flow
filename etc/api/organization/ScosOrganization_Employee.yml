openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Employee
  description: APIs para gestão de funcionários, hierarquia, contatos e endereços.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: Employee
    description: APIs para registro dos dados do Funcionário
  - name: Employee Contact
    description: APIs para registro dos contatos do Funcionário
  - name: Employee Address
    description: APIs para registro dos endereços do Funcionário
  - name: Employee Work Schedule
    description: APIs para gestão da jornada de trabalho efetiva do Funcionário

paths:
  /v1/employees:
    get:
      tags: [Employee]
      summary: Get all employees
      description: UC-036 - Lista todos os funcionários com paginação e filtros
      operationId: getAllEmployees
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/companyIdFilter'
        - $ref: '#/components/parameters/positionIdFilter'
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]
    post:
      tags: [Employee]
      summary: Create an employee
      description: UC-035 - Registra funcionário vinculado a cargo e empresa ativos
      operationId: createEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE
        ttl: 1

  /v1/employees/rehire:
    post:
      tags: [Employee]
      summary: Rehire employee
      description: >-
        UC-155 - Recontrata um funcionário localizado pelo CPF, cujo status atual é INACTIVE. Reativa a linha existente (INACTIVE→ACTIVE) - não cria um EMPLOYEE novo, preservando EMPLOYEE_ID, TAX_IDENTIFIER e EMAIL originais.
        Empresa, cargo, supervisor e tipo de contrato podem mudar em relação ao vínculo anterior. reasonPositionChangeId é sempre obrigatório - gera nova linha em EmployeePositionHistory mesmo quando o cargo não muda, fechando a linha antiga via TRG_CLOSE_PREVIOUS_POSITION.
        Retorna 4XX se não existir funcionário INACTIVE com este CPF (nunca existiu, ou o CPF pertence a um funcionário ACTIVE/DISABLED)
      operationId: rehireEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RehireEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [REHIRE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE_REHIRE
        ttl: 1

    get:
      tags: [Employee]
      summary: Get employee by id
      description: UC-037 - Retorna dados completos incluindo cargo, empresa e supervisor
      operationId: getEmployeeById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]
    put:
      tags: [Employee]
      summary: Update employee
      description: UC-038 - Atualiza dados pessoais. Para empresa, cargo ou supervisor use transfer
      operationId: updateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE
        ttl: 1
  /v1/employees/{id}/enable:
    put:
      tags: [Employee]
      summary: Activate employee
      description: >-
        UC-039 - Transição de domínio "activate": reativa funcionário com status INACTIVE para ACTIVE.
        Nome da rota (`enable`) não corresponde 1:1 ao nome da transição de domínio (`activate`) - motivo vem do catálogo ReasonActivate
      operationId: activateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{id}/disable:
    put:
      tags: [Employee]
      summary: Inactivate employee
      description: >-
        UC-040 - Transição de domínio "inactivate": inativa funcionário com status ACTIVE para INACTIVE. Logins vinculados são inativados e desabilitados no Keycloak via Saga.
        Nome da rota (`disable`) não corresponde 1:1 ao nome da transição de domínio (`inactivate`) - motivo vem do catálogo ReasonInactivate
      operationId: inactivateEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{id}/block:
    put:
      tags: [Employee]
      summary: Block employee
      description: >-
        UC-043 - Transição de domínio "disable": bloqueia funcionário, status muda para DISABLED. Logins vinculados são inativados e desabilitados no Keycloak via Saga.
        Nome da rota (`block`) não corresponde 1:1 ao nome da transição de domínio (`disable`) - motivo vem do catálogo ReasonDisable.
        Só é aceito quando o status atual é ACTIVE - a partir de INACTIVE retorna 4XX
      operationId: blockEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [BLOCK_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{id}/unblock:
    put:
      tags: [Employee]
      summary: Unblock employee
      description: >-
        UC-139 - Transição de domínio "enable": desbloqueia funcionário com status DISABLED para ACTIVE.
        Nome da rota (`unblock`) não corresponde 1:1 ao nome da transição de domínio (`enable`) - motivo vem do catálogo ReasonEnable
      operationId: unblockEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UNBLOCK_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{id}/status-history:
    get:
      tags: [Employee]
      summary: Get employee status history
      description: UC-140 - Histórico paginado e somente leitura das transições de status do funcionário, populado exclusivamente pelas rotas enable/disable/block/unblock
      operationId: getEmployeeStatusHistory
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeStatusHistoryResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_STATUS_HISTORY]

  /v1/employees/{id}/transfer:
    patch:
      tags: [Employee]
      summary: Transfer employee
      description: UC-041 - Transfere para outra empresa, filial, cargo ou supervisor. Mudança de empresa dispara Saga Keycloak TYPE=UPDATE
      operationId: transferEmployee
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferEmployeeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [TRANSFER_EMPLOYEE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{id}/hierarchy:
    get:
      tags: [Employee]
      summary: Get employee hierarchy
      description: UC-042 - Retorna a cadeia de supervisores em árvore ascendente
      operationId: getEmployeeHierarchy
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeHierarchyResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]

  /v1/employees/{id}/subordinates:
    get:
      tags: [Employee]
      summary: Get employee subordinates
      description: UC-080 - Lista os funcionários que reportam diretamente ao funcionário informado
      operationId: getEmployeeSubordinates
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE]

  /v1/employees/{id}/position-history:
    get:
      tags: [Employee]
      summary: Get employee position history
      description: UC-112 - Lista o histórico de cargos do funcionário, paginado, do mais recente para o mais antigo. A linha com endDate nulo é a atribuição vigente
      operationId: getEmployeePositionHistory
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeePositionHistoryResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_POSITION_HISTORY]

  /v1/employees/{employeeId}/contacts:
    get:
      tags: [Employee Contact]
      summary: Get all employee contacts
      description: UC-044 - Lista todos os contatos de um funcionário
      operationId: getAllEmployeeContacts
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/idEmployee'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeContactsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_CONTACT]
    post:
      tags: [Employee Contact]
      summary: Create an employee contact
      description: UC-045 - Adiciona um contato telefônico ao funcionário
      operationId: createEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeContactRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE_CONTACT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE_CONTACT
        ttl: 1

  /v1/employees/{employeeId}/contacts/{id}:
    get:
      tags: [Employee Contact]
      summary: Get employee contact by id
      description: UC-046 - Retorna um contato específico do funcionário
      operationId: getEmployeeContactById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeContactResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_CONTACT]
    put:
      tags: [Employee Contact]
      summary: Update employee contact
      description: UC-047 - Atualiza o tipo ou telefone de um contato
      operationId: updateEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeContactRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE_CONTACT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1
    delete:
      tags: [Employee Contact]
      summary: Delete employee contact
      description: UC-048 - Remove um contato do funcionário
      operationId: deleteEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_EMPLOYEE_CONTACT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{employeeId}/addresses:
    get:
      tags: [Employee Address]
      summary: Get all employee addresses
      description: UC-049 - Lista todos os endereços vinculados a um funcionário
      operationId: getAllEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/idEmployee'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeAddressResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_ADDRESS]
    post:
      tags: [Employee Address]
      summary: Create an employee address
      description: UC-050 - Vincula um endereço externo ao funcionário. Integridade do addressId garantida pela aplicação
      operationId: createEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeAddressRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE_ADDRESS]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE_ADDRESS
        ttl: 1

  /v1/employees/{employeeId}/addresses/{id}:
    get:
      tags: [Employee Address]
      summary: Get employee address by id
      description: UC-051 - Retorna o vínculo de endereço do funcionário
      operationId: getEmployeeAddressById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeAddressResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_ADDRESS]
    put:
      tags: [Employee Address]
      summary: Update employee address
      description: UC-052 - Atualiza os dados do vínculo. Não altera o addressId externo
      operationId: updateEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeAddressRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE_ADDRESS]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1
    delete:
      tags: [Employee Address]
      summary: Delete employee address
      description: UC-053 - Remove o vínculo de endereço. O registro externo não é afetado
      operationId: deleteEmployeeAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_EMPLOYEE_ADDRESS]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

  /v1/employees/{employeeId}/work-schedule:
    get:
      tags: [Employee Work Schedule]
      summary: Get employee work schedule
      description: >-
        UC-148 - Lista a jornada de trabalho efetiva do funcionário, um item por dia da semana cadastrado.
        Retorna array direto, sem paginação - a UK composta (employeeId, dayOfWeek) garante teto real de 7 registros.
        Dia sem registro não aparece na resposta - o sistema não infere o horário do template do cargo como fallback
      operationId: getAllEmployeeWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeWorkScheduleResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_EMPLOYEE_WORK_SCHEDULE]
    post:
      tags: [Employee Work Schedule]
      summary: Create employee work schedule
      description: UC-149 - Cria o horário de um dia da semana da jornada efetiva do funcionário. Rejeitado se já existir registro para esse (employeeId, dayOfWeek)
      operationId: createEmployeeWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeWorkScheduleRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_EMPLOYEE_WORK_SCHEDULE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_EMPLOYEE_WORK_SCHEDULE
        ttl: 1

  /v1/employees/{employeeId}/work-schedule/{dayOfWeek}:
    put:
      tags: [Employee Work Schedule]
      summary: Update employee work schedule
      description: UC-150 - Atualiza o horário de um dia da semana já cadastrado na jornada efetiva do funcionário
      operationId: updateEmployeeWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: '#/components/parameters/dayOfWeekPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeWorkScheduleRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_EMPLOYEE_WORK_SCHEDULE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1
    delete:
      tags: [Employee Work Schedule]
      summary: Delete employee work schedule
      description: UC-151 - Remove o horário de um dia da semana da jornada efetiva do funcionário
      operationId: deleteEmployeeWorkSchedule
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: '#/components/parameters/dayOfWeekPath'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_EMPLOYEE_WORK_SCHEDULE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1

components:
  securitySchemes:
    BearerAuth:
      $ref: './ScosComponents.yml#/components/securitySchemes/BearerAuth'
  parameters:
    idEmployee:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    companyIdFilter:
      name: companyId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    positionIdFilter:
      name: positionId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EmployeeStatus'
    dayOfWeekPath:
      name: dayOfWeek
      in: path
      required: true
      schema:
        $ref: './ScosComponents.yml#/components/schemas/DayOfWeek'
      x-jdempotentrequestpayload: true
  schemas:
    EmployeeStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - DISABLED
    EmployeeContractType:
      type: string
      enum:
        - CLT
        - PJ
        - ESTAGIO
        - TEMPORARIO
    Employees:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/EmployeeStatus'
    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
        email:
          type: string
        birthDate:
          type: string
          format: date
        dateOfHiring:
          type: string
          format: date
        observation:
          type: string
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        supervisor:
          $ref: '#/components/schemas/Supervisor'
        company:
          $ref: '#/components/schemas/EmployeeCompany'
        position:
          $ref: './ScosOrganization_Department-Position.yml#/components/schemas/Position'
        contractType:
          $ref: '#/components/schemas/EmployeeContractType'
        probationEndDate:
          type: string
          format: date
          nullable: true
    Supervisor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    EmployeeCompany:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    EmployeeHierarchyNode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        position:
          type: string
        supervisor:
          $ref: '#/components/schemas/EmployeeHierarchyNode'
    GetEmployeeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'
    GetAllEmployeesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employees'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    GetEmployeeHierarchyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmployeeHierarchyNode'
    EmployeePositionHistory:
      type: object
      properties:
        positionId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
          description: Nulo indica a atribuição de cargo vigente
        reasonPositionChangeId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        userAt:
          type: string
    GetAllEmployeePositionHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeePositionHistory'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateEmployeeRequest:
      required: [name, nameTreatment, taxIdentifier, email, birthDate, dateOfHiring, companyId, positionId, contractType, reasonActivateId]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        nameTreatment:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        taxIdentifier:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
          x-is-cpf: true
        email:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        birthDate:
          type: string
          format: date
          x-required-message: SCOS_VALIDATION_003
        dateOfHiring:
          type: string
          format: date
          x-required-message: SCOS_VALIDATION_003
        observation:
          type: string
        supervisorId:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
        positionId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
        contractType:
          allOf:
            - $ref: '#/components/schemas/EmployeeContractType'
          x-required-message: SCOS_VALIDATION_003
        probationEndDate:
          type: string
          format: date
        reasonActivateId:
          type: integer
          format: int64
          description: Motivo da criação (primeira linha de status ACTIVE em EmployeeStatusHistory). Referencia ReasonActivate com entityType=EMPLOYEE
          x-required-message: SCOS_VALIDATION_003
    UpdateEmployeeRequest:
      required: [name, nameTreatment, email, birthDate, dateOfHiring, contractType]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        nameTreatment:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        email:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        birthDate:
          type: string
          format: date
          x-required-message: SCOS_VALIDATION_003
        dateOfHiring:
          type: string
          format: date
          x-required-message: SCOS_VALIDATION_003
        observation:
          type: string
        contractType:
          allOf:
            - $ref: '#/components/schemas/EmployeeContractType'
          x-required-message: SCOS_VALIDATION_003
        probationEndDate:
          type: string
          format: date
    TransferEmployeeRequest:
      required: [reasonPositionChangeId]
      type: object
      description: reasonPositionChangeId é sempre obrigatório - toda transferência gera uma nova linha em EmployeePositionHistory, mesmo quando positionId não muda. Demais campos são opcionais - preencher apenas o que está sendo transferido
      properties:
        companyId:
          type: integer
          format: int64
          description: Nova empresa ou filial
        positionId:
          type: integer
          format: int64
          description: Novo cargo
        supervisorId:
          type: integer
          format: int64
          description: Novo supervisor direto. Não pode ser o próprio funcionário nem um subordinado
        dateOfTransfer:
          type: string
          format: date
          description: Data efetiva da transferência
        reasonPositionChangeId:
          type: integer
          format: int64
          description: Motivo da transferência. Sempre obrigatório - gera nova linha em EmployeePositionHistory
          x-required-message: SCOS_VALIDATION_003
    RehireEmployeeRequest:
      required: [taxIdentifier, companyId, positionId, contractType, reasonActivateId, reasonPositionChangeId]
      type: object
      description: >-
        Localiza o funcionário pelo CPF - deve existir exatamente um EMPLOYEE com este taxIdentifier em status INACTIVE.
        companyId/positionId/contractType são obrigatórios mesmo se forem os mesmos de antes de sair - a recontratação não herda valores implicitamente
      properties:
        taxIdentifier:
          type: string
          description: CPF do funcionário a recontratar. Localiza o EMPLOYEE - não é possível recontratar por EMPLOYEE_ID direto
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
          x-is-cpf: true
        companyId:
          type: integer
          format: int64
          description: Empresa ou filial de retorno. Pode ser igual ou diferente da anterior
          x-required-message: SCOS_VALIDATION_003
        positionId:
          type: integer
          format: int64
          description: Cargo de retorno. Pode ser igual ou diferente do anterior
          x-required-message: SCOS_VALIDATION_003
        supervisorId:
          type: integer
          format: int64
          description: Novo supervisor direto. Opcional - se omitido, funcionário volta sem supervisor definido, não herda o supervisor antigo
        contractType:
          allOf:
            - $ref: '#/components/schemas/EmployeeContractType'
          x-required-message: SCOS_VALIDATION_003
        probationEndDate:
          type: string
          format: date
          description: Novo fim de período de experiência, se aplicável ao contrato. Não herda o valor anterior
        dateOfRehire:
          type: string
          format: date
          description: Nova data de contratação (DATE_OF_HIRING). Se omitido, mantém a data original do primeiro vínculo
        reasonActivateId:
          type: integer
          format: int64
          description: Motivo da reativação (INACTIVE→ACTIVE em EmployeeStatusHistory). Referencia ReasonActivate com entityType=EMPLOYEE
          x-required-message: SCOS_VALIDATION_003
        reasonPositionChangeId:
          type: integer
          format: int64
          description: Motivo da mudança de cargo. Sempre obrigatório - gera nova linha em EmployeePositionHistory mesmo se companyId/positionId não mudarem
          x-required-message: SCOS_VALIDATION_003
        observation:
          type: string
          description: Complemento textual livre sobre a recontratação, gravado em EmployeeStatusHistory.observation
    EmployeeContact:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contactTypeId:
          type: integer
          format: int64
        phone:
          type: string
    GetEmployeeContactResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmployeeContact'
    GetAllEmployeeContactsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeContact'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateEmployeeContactRequest:
      required: [contactTypeId, phone]
      type: object
      properties:
        contactTypeId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
          x-jdempotentrequestpayload: true
        phone:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
    UpdateEmployeeContactRequest:
      required: [contactTypeId, phone]
      type: object
      properties:
        contactTypeId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
        phone:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
    EmployeeAddresses:
      type: object
      properties:
        id:
          type: integer
          format: int64
        addressTypeId:
          type: integer
          format: int64
        number:
          type: integer
          format: int32
        complement:
          type: string
    EmployeeAddress:
      type: object
      properties:
        id:
          type: integer
          format: int64
        addressId:
          type: integer
          format: int64
        addressTypeId:
          type: integer
          format: int64
        number:
          type: integer
          format: int32
        complement:
          type: string
        latitude:
          type: string
        longitude:
          type: string
    GetEmployeeAddressResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmployeeAddress'
    GetAllEmployeeAddressResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeAddresses'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateEmployeeAddressRequest:
      required: [addressTypeId, number, latitude, longitude, addressId]
      type: object
      properties:
        addressTypeId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
          x-jdempotentrequestpayload: true
        number:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-jdempotentrequestpayload: true
        complement:
          type: string
        latitude:
          type: string
          x-required-message: SCOS_VALIDATION_003
        longitude:
          type: string
          x-required-message: SCOS_VALIDATION_003
        addressId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
          x-jdempotentrequestpayload: true
    UpdateEmployeeAddressRequest:
      required: [addressTypeId, number, latitude, longitude]
      type: object
      properties:
        addressTypeId:
          type: integer
          format: int64
          x-required-message: SCOS_VALIDATION_003
        number:
          type: string
          x-required-message: SCOS_VALIDATION_003
        complement:
          type: string
        latitude:
          type: string
          x-required-message: SCOS_VALIDATION_003
        longitude:
          type: string
          x-required-message: SCOS_VALIDATION_003
    EmployeeStatusTransitionRequest:
      required: [reasonId]
      type: object
      properties:
        reasonId:
          type: integer
          format: int64
          description: >-
            Motivo da transição. Referencia o catálogo Reason* correspondente à transição de domínio
            (enable→ReasonActivate, disable→ReasonInactivate, block→ReasonDisable, unblock→ReasonEnable)
          x-required-message: SCOS_VALIDATION_003
          x-jdempotentrequestpayload: true
        observation:
          type: string
    EmployeeStatusHistory:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        previousStatus:
          $ref: '#/components/schemas/EmployeeStatus'
        reasonActivateId:
          type: integer
          format: int64
          nullable: true
        reasonInactivateId:
          type: integer
          format: int64
          nullable: true
        reasonDisableId:
          type: integer
          format: int64
          nullable: true
        reasonEnableId:
          type: integer
          format: int64
          nullable: true
        observation:
          type: string
          nullable: true
        userAt:
          type: string
        createdAt:
          type: string
          format: date-time
    GetAllEmployeeStatusHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeStatusHistory'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    EmployeeWorkSchedule:
      type: object
      properties:
        dayOfWeek:
          $ref: './ScosComponents.yml#/components/schemas/DayOfWeek'
        startTime:
