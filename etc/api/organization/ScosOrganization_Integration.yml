
openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Integration
  description: |
    APIs operacionais para o administrador acompanhar e agir sobre a fila
    de integração com o Keycloak (Outbox + dead letter).
    Sem cache - dados operacionais que exigem leitura em tempo real.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: Integration Keycloak
    description: APIs para acompanhar a fila de integração com o Keycloak
  - name: Integration Message Invalid
    description: APIs para consultar a fila de mensagens mortas (dead letter)

paths:
  /v1/integrations/keycloak:
    get:
      tags: [Integration Keycloak]
      summary: Get all Keycloak integrations
      description: UC-081 - Lista as operações da fila de integração (Outbox). O payload só é retornado na consulta individual
      operationId: getAllIntegrationsKeycloak
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/typeFilter'
        - $ref: './ScosComponents.yml#/components/parameters/startDate'
        - $ref: './ScosComponents.yml#/components/parameters/endDate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllIntegrationsKeycloakResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_INTEGRATION]
      security:
        - BearerAuth: []

  /v1/integrations/keycloak/{id}:
    get:
      tags: [Integration Keycloak]
      summary: Get Keycloak integration by id
      description: UC-082 - Retorna a operação com o payload enviado e o histórico completo de tentativas. Dados sensíveis do payload são mascarados
      operationId: getIntegrationKeycloakById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idIntegration'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIntegrationKeycloakResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_INTEGRATION]
      security:
        - BearerAuth: []

  /v1/integrations/keycloak/{id}/retry:
    post:
      tags: [Integration Keycloak]
      summary: Retry Keycloak integration
      description: UC-083 - Reenfileira operação com status ERROR. Zera o RETRY_COUNT e retorna ao status PENDING. O processador verifica o KEYCLOAK_ID antes de chamar o Keycloak - garantia de idempotência
      operationId: retryIntegrationKeycloak
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idIntegration'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [RETRY_INTEGRATION]
      security:
        - BearerAuth: []

  /v1/integrations/messages-invalid:
    get:
      tags: [Integration Message Invalid]
      summary: Get all invalid messages
      description: UC-084 - Consulta a fila de mensagens mortas (dead letter) para análise e correção manual
      operationId: getAllMessagesInvalid
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/startDate'
        - $ref: './ScosComponents.yml#/components/parameters/endDate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllMessagesInvalidResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_INTEGRATION]
      security:
        - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idIntegration:
      name: id
      in: path
      required: true
      description: Identificador da operação de integração (UUID)
      schema:
        type: string
        format: uuid
      x-jdempotentrequestpayload: true
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IntegrationStatus'
    typeFilter:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IntegrationType'
  schemas:
    IntegrationStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - SUCCESS
        - ERROR
        - CANCELLED
    IntegrationType:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - RESET_PASSWORD
    IntegrationKeycloak:
      type: object
      properties:
        id:
          type: string
          format: uuid
        keycloakId:
          type: string
          format: uuid
          description: Nulo enquanto o Keycloak não confirmar a criação
        realm:
          type: string
        email:
          type: string
        username:
          type: string
        requesting:
          type: string
          description: Origem da solicitação
        type:
          $ref: '#/components/schemas/IntegrationType'
        status:
          $ref: '#/components/schemas/IntegrationStatus'
        retryCount:
          type: integer
          format: int32
        maxRetries:
          type: integer
          format: int32
        createdAt:
          type: string
        updatedAt:
          type: string
    IntegrationKeycloakDetail:
      allOf:
        - $ref: '#/components/schemas/IntegrationKeycloak'
        - type: object
          properties:
            request:
              type: string
              description: Payload JSON enviado ao Keycloak. Dados sensíveis mascarados
            logs:
              type: array
              description: Histórico de tentativas ordenado da mais recente para a mais antiga
              items:
                $ref: '#/components/schemas/IntegrationKeycloakLog'
    IntegrationKeycloakLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        success:
          type: boolean
        response:
          type: string
          description: Resposta retornada pelo Keycloak na tentativa
        createdAt:
          type: string
    GetIntegrationKeycloakResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/IntegrationKeycloakDetail'
    GetAllIntegrationsKeycloakResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationKeycloak'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    MessageInvalid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        messageInvalid:
          type: string
          description: Conteúdo da mensagem que não pôde ser processada
        createdAt:
          type: string
    GetAllMessagesInvalidResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageInvalid'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'

security:
  - BearerAuth: []
