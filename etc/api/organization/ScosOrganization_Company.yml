      properties:
        data:
          $ref: '#/components/schemas/Company'
    GetAllCompaniesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Companies'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    GetCompanyHierarchyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyHierarchyNode'
    CreateCompanyRequest:
      required: [name, nameTreatment, taxIdentifier, foundationDate, sectorOfActivity, reasonActivateId]
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        nameTreatment:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        taxIdentifier:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
          x-is-cnpj: true
        foundationDate:
          type: string
          format: date
          x-required-message: SCOS-003
        sectorOfActivity:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        observation:
          type: string
        parentCompanyId:
          type: integer
          format: int64
          description: Preenchido apenas para filiais. Nulo indica empresa matriz
