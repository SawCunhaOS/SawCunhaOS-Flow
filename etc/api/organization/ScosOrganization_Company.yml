      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idCompany:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    idCnae:
      name: cnaeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    statusFilter:
