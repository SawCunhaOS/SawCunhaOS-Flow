openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Company
  description: APIs para gestão de empresas, filiais, contatos e endereços.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: Company
    description: APIs para registro dos dados da Empresa
  - name: Company Contact
    description: APIs para registro dos dados de contato da Empresa
  - name: Company Address
    description: APIs para registro dos endereços da Empresa
  - name: Legal Nature
    description: APIs para gestão do catálogo de naturezas jurídicas
  - name: Cnae
    description: APIs para gestão do catálogo de CNAEs
  - name: Company Cnae Secondary
    description: APIs para associação de CNAEs secundários à empresa

paths:
  /v1/companies:
    get:
      tags: [Company]
      summary: Get all companies
      description: UC-004 - Lista todas as empresas e filiais com paginação
      operationId: getAllCompanies
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/nameFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCompaniesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []
    post:
      tags: [Company]
      summary: Create a company
      description: UC-001/UC-002 - Cadastra empresa matriz (parentCompanyId nulo) ou filial
      operationId: createCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_COMPANY]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{id}:
    get:
      tags: [Company]
      summary: Get company by id
      description: UC-003 - Retorna os dados completos de uma empresa pelo ID
      operationId: getCompanyById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompanyResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []
    put:
      tags: [Company]
      summary: Update company
      description: UC-005 - Atualiza os dados cadastrais. Não altera o vínculo com a empresa mãe
      operationId: updateCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_COMPANY]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []
  /v1/companies/{id}/enable:
    put:
      tags: [Company]
      summary: Activate company
      description: >-
        UC-006 - Transição de domínio "activate": reativa empresa com status INACTIVE para ACTIVE.
        Nome da rota (`enable`) não corresponde 1:1 ao nome da transição de domínio (`activate`) - motivo vem do catálogo ReasonActivate
      operationId: activateCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{id}/disable:
    put:
      tags: [Company]
      summary: Inactivate company
      description: >-
        UC-007 - Transição de domínio "inactivate": inativa empresa com status ACTIVE para INACTIVE.
        Nome da rota (`disable`) não corresponde 1:1 ao nome da transição de domínio (`inactivate`) - motivo vem do catálogo ReasonInactivate
      operationId: inactivateCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{id}/block:
    put:
      tags: [Company]
      summary: Block company
      description: >-
        UC-008 - Transição de domínio "disable": bloqueia empresa, status muda para DISABLED.
        Nome da rota (`block`) não corresponde 1:1 ao nome da transição de domínio (`disable`) - motivo vem do catálogo ReasonDisable.
        Só é aceito quando o status atual é ACTIVE - a partir de INACTIVE retorna 4XX
      operationId: blockCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [BLOCK_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{id}/unblock:
    put:
      tags: [Company]
      summary: Unblock company
      description: >-
        UC-137 - Transição de domínio "enable": desbloqueia empresa com status DISABLED para ACTIVE.
        Nome da rota (`unblock`) não corresponde 1:1 ao nome da transição de domínio (`enable`) - motivo vem do catálogo ReasonEnable
      operationId: unblockCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyStatusTransitionRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UNBLOCK_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{id}/status-history:
    get:
      tags: [Company]
      summary: Get company status history
      description: UC-138 - Histórico paginado e somente leitura das transições de status da empresa, populado exclusivamente pelas rotas enable/disable/block/unblock
      operationId: getCompanyStatusHistory
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCompanyStatusHistoryResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY_STATUS_HISTORY]
      x-cache: [SCOS_ORGANIZATION_COMPANY_STATUS_HISTORY]
      security:
        - BearerAuth: []

  /v1/companies/{id}/hierarchy:
    get:
      tags: [Company]
      summary: Get company hierarchy
      description: UC-009 - Retorna a hierarquia completa em árvore recursiva - matriz e filiais em todos os níveis
      operationId: getCompanyHierarchy
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompanyHierarchyResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{id}/branches:
    get:
      tags: [Company]
      summary: Get company branches
      description: UC-010 - Lista as filiais diretamente vinculadas - primeiro nível, sem recursividade
      operationId: getCompanyBranches
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCompaniesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY]
      x-cache: [SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{companyId}/contacts:
    get:
      tags: [Company Contact]
      summary: Get all company contacts
      description: UC-011 - Lista todos os contatos de uma empresa
      operationId: getAllCompanyContacts
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/idCompany'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCompanyContactsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY_CONTACT]
      x-cache: [SCOS_ORGANIZATION_COMPANY_CONTACT]
      security:
        - BearerAuth: []
    post:
      tags: [Company Contact]
      summary: Create a company contact
      description: UC-012 - Adiciona um contato à empresa
      operationId: createCompanyContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyContactRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_COMPANY_CONTACT]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY_CONTACT
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_COMPANY_CONTACT, SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{companyId}/contacts/{id}:
    get:
      tags: [Company Contact]
      summary: Get company contact by id
      description: UC-013 - Retorna um contato específico da empresa
      operationId: getCompanyContactById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompanyContactResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY_CONTACT]
      x-cache: [SCOS_ORGANIZATION_COMPANY_CONTACT]
      security:
        - BearerAuth: []
    put:
      tags: [Company Contact]
      summary: Update company contact
      description: UC-014 - Atualiza os dados de um contato da empresa
      operationId: updateCompanyContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyContactRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_COMPANY_CONTACT]
      x-cache: [SCOS_ORGANIZATION_COMPANY_CONTACT, SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []
    delete:
      tags: [Company Contact]
      summary: Delete company contact
      description: UC-015 - Remove um contato da empresa
      operationId: deleteCompanyContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_COMPANY_CONTACT]
      x-cache: [SCOS_ORGANIZATION_COMPANY_CONTACT, SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{companyId}/addresses:
    get:
      tags: [Company Address]
      summary: Get all company addresses
      description: UC-016 - Lista todos os endereços vinculados a uma empresa
      operationId: getAllCompanyAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/idCompany'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCompanyAddressResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_COMPANY_ADDRESS]
      security:
        - BearerAuth: []
    post:
      tags: [Company Address]
      summary: Create a company address
      description: UC-017 - Vincula um endereço externo à empresa. Integridade do addressId garantida pela aplicação
      operationId: createCompanyAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyAddressRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_COMPANY_ADDRESS]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_COMPANY_ADDRESS
        ttl: 1
      x-cache: [SCOS_ORGANIZATION_COMPANY_ADDRESS, SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/companies/{companyId}/addresses/{id}:
    get:
      tags: [Company Address]
      summary: Get company address by id
      description: UC-018 - Retorna o vínculo de endereço da empresa
      operationId: getCompanyAddressById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCompanyAddressResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_COMPANY_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_COMPANY_ADDRESS]
      security:
        - BearerAuth: []
    put:
      tags: [Company Address]
      summary: Update company address
      description: UC-019 - Atualiza os dados do vínculo. Não altera o addressId externo
      operationId: updateCompanyAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyAddressRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_COMPANY_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_COMPANY_ADDRESS, SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []
    delete:
      tags: [Company Address]
      summary: Delete company address
      description: UC-020 - Remove o vínculo de endereço. O registro externo não é afetado
      operationId: deleteCompanyAddress
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idCompany'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DELETE_COMPANY_ADDRESS]
      x-cache: [SCOS_ORGANIZATION_COMPANY_ADDRESS, SCOS_ORGANIZATION_COMPANY]
      security:
        - BearerAuth: []

  /v1/legal-natures:
    get:
      tags: [Legal Nature]
      summary: Get all legal natures
      description: UC-093 - Lista todas as naturezas jurídicas com paginação
      operationId: getAllLegalNatures
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllLegalNaturesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_LEGAL_NATURE]
      x-cache: [SCOS_ORGANIZATION_LEGAL_NATURE]
      security:
        - BearerAuth: []
    post:
      tags: [Legal Nature]
      summary: Create a legal nature
      description: UC-094 - Cria uma nova natureza jurídica
      operationId: createLegalNature
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
