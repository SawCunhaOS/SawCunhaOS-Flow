  schemas:
    Companies:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        sectorOfActivity:
          type: string
        observation:
          type: string
        status:
          $ref: '#/components/schemas/StatusCompany'
    Company:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
        foundationDate:
          type: string
          format: date
        sectorOfActivity:
          type: string
        observation:
          type: string
        parentCompany:
          $ref: '#/components/schemas/ParentCompany'
        status:
          $ref: '#/components/schemas/StatusCompany'
        legalNatureId:
          type: integer
          format: int64
          nullable: true
        cnaePrincipalId:
          type: integer
          format: int64
          nullable: true
        stateRegistration:
          type: string
          nullable: true
          description: Inscrição estadual. Aceita o valor "ISENTO"
        municipalRegistration:
          type: string
          nullable: true
    ParentCompany:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
