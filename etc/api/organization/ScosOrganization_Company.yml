openapi: 3.0.3
info:
  title: Inside Flow Partners - Company
  description: The Inside Flow Partners system contains APIs to use in partners management.
  termsOfService: http://licencas.softwarelivre.org/gpl-3.0.pt-br.html
  contact:
    name: Samuel Cunha
    url: https://github.com/InsideSoftwares
    email: samuel.cunha@insidesoftwares.com.br
  license:
    name: License - GNU
    url: http://licencas.softwarelivre.org/gpl-3.0.pt-br.html
  version: '1.0'
servers:
  - url: /insideflow/partners/api
    description: Generated server url
tags:
  - name: Company
    description: APIs para registro dos dados da Empresa
  - name: Company Contact
    description: APIs para registro dos dados de contato da Empresa
  - name: Company Address
    description: APIs para registro do endereços da Empresa
  - name: Company Document
    description: APIs para registro dos documentos da Empresa

paths:
  /v1/company:
    get:
      tags:
        - Company
      summary: Get all Companies
      description: Get all Companies
      operationId: getAllCompanies
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllCompaniesResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_COMPANY ]
      x-cache: [ INSIDE_FLOW_PARTNERS_COMPANY ]
    post:
      tags:
        - Company
      summary: Create a company
      description: Create a company
      operationId: createCompany
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ CREATE_COMPANY ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_COMPANY
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_COMPANY, INSIDE_FLOW_PARTNERS_COMPANY_CONTACT, INSIDE_FLOW_PARTNERS_COMPANY_ADDRESS ]
  /v1/company/{id}:
    get:
      tags:
        - Company
      summary: Get Company by id
      description: Get Company by id
      operationId: getCompanyById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
