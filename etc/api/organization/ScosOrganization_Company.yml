components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  parameters:
    idCompany:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true

  schemas:
    Companies:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        sectorOfActivity:
          type: string
        observation:
          type: string
        active:
          type: boolean
        status:
          $ref: '#/components/schemas/StatusCompany'
    Company:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
        foundationDate:
          type: string
          format: date
        dateCreated:
          type: string
          format: date
        sectorOfActivity:
          type: string
        observation:
          type: string
        active:
          type: boolean
        parentCompany:
          $ref: '#/components/schemas/ParentCompany'
        status:
          $ref: '#/components/schemas/StatusCompany'
    ParentCompany:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        taxIdentifier:
          type: string
    GetCompanyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Company'
    GetAllCompaniesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Companies'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateCompanyRequest:
      required:
        - name
        - nameTreatment
        - taxIdentifier
        - foundationDate
        - sectorOfActivity
      type: object
      properties:
        name:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        nameTreatment:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        taxIdentifier:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
          x-is-cnpj: true
        foundationDate:
          type: string
          format: date
          x-required-message: SCOS-003
        sectorOfActivity:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        observation:
          type: string
        parentCompanyId:
          type: integer
          format: int64
    UpdateCompanyRequest:
      required:
        - name
        - nameTreatment
        - taxIdentifier
        - foundationDate
        - sectorOfActivity
