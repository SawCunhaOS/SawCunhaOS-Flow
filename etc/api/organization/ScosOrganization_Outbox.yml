openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Outbox
  description: APIs de monitoria de eventos do Outbox genérico (multi-backend), sucessor do contrato de integração dedicado ao Keycloak.
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: Outbox
    description: APIs para monitoria e reprocessamento de eventos do Outbox

paths:
  /v1/outbox-events:
    get:
      tags: [Outbox]
      summary: Get all outbox events
      description: Lista paginada de eventos do outbox, filtrável por tópico, status e id do agregado de origem
      operationId: getAllOutboxEvents
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/topicFilter'
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/aggregateIdFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllOutboxEventsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_OUTBOX_EVENT]
      security:
        - BearerAuth: []

  /v1/outbox-events/{id}:
    get:
      tags: [Outbox]
      summary: Get outbox event by id
      description: Retorna o detalhe de um evento do outbox, incluindo payload, dados de resposta (quando o backend do tópico é DIRECT_API), contagem de tentativas e mensagem de erro
      operationId: getOutboxEventById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOutboxEventResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_OUTBOX_EVENT]
      security:
        - BearerAuth: []

  /v1/outbox-events/{id}/logs:
    get:
      tags: [Outbox]
      summary: Get outbox event logs
      description: Lista paginada das tentativas de entrega de um evento do outbox, uma linha por consumidor/tentativa
      operationId: getOutboxEventLogs
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllOutboxEventLogsResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_OUTBOX_EVENT]
      security:
        - BearerAuth: []

  /v1/outbox-events/{id}/retry:
    put:
      tags: [Outbox]
      summary: Retry outbox event
      description: Reprocessa um evento do outbox — só válido quando o status atual é FAILED, volta o status para PENDING. Rejeita com 4XX quando o status atual não é FAILED
      operationId: retryOutboxEvent
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: './ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [RETRY_OUTBOX_EVENT]
      security:
        - BearerAuth: []

  /v1/outbox-events/dead-letters:
    get:
      tags: [Outbox]
      summary: Get all outbox event dead letters
      description: Lista paginada de eventos do outbox que excederam o número de tentativas ou chegaram corrompidos, filtrável por tópico e tipo de erro
      operationId: getAllOutboxEventDeadLetters
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/topicFilter'
        - $ref: '#/components/parameters/errorTypeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllOutboxEventDeadLettersResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_OUTBOX_EVENT_DEAD_LETTER]
      security:
        - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    topicFilter:
      name: topic
      in: query
      required: false
      schema:
        type: string
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OutboxEventStatus'
    aggregateIdFilter:
      name: aggregateId
      in: query
      required: false
      schema:
        type: string
    errorTypeFilter:
      name: errorType
      in: query
      required: false
      schema:
        type: string
  schemas:
    OutboxEventStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - PROCESSED
        - FAILED
    OutboxEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        topic:
          type: string
        aggregateId:
          type: string
        payload:
          type: object
          description: Payload livre (JSONB) — o formato varia por tópico/consumidor, sem schema fixo
        status:
          $ref: '#/components/schemas/OutboxEventStatus'
        retryCount:
          type: integer
          format: int32
        message:
          type: string
        responseData:
          type: object
          description: Resposta livre (JSONB) — preenchida só quando o backend do tópico é DIRECT_API
        createdAt:
          type: string
          format: date-time
    OutboxEventLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        consumer:
          type: string
        success:
          type: boolean
        response:
          type: string
        createdAt:
          type: string
          format: date-time
    OutboxEventDeadLetter:
      type: object
      properties:
        id:
          type: integer
          format: int64
        topic:
          type: string
        source:
          type: string
        payload:
          type: object
          description: Payload livre (JSONB) do evento original
        errorType:
          type: string
        retryCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    GetOutboxEventResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OutboxEvent'
    GetAllOutboxEventsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboxEvent'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    GetAllOutboxEventLogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboxEventLog'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    GetAllOutboxEventDeadLettersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboxEventDeadLetter'
        paginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'

security:
  - BearerAuth: []
