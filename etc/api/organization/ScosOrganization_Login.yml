openapi: 3.0.3
info:
  title: Inside Flow Partners - Login
  description: The Inside Flow Partners system contains APIs to use in partners management.
  termsOfService: http://licencas.softwarelivre.org/gpl-3.0.pt-br.html
  contact:
    name: Samuel Cunha
    url: https://github.com/InsideSoftwares
    email: samuel.cunha@insidesoftwares.com.br
  license:
    name: License - GNU
    url: http://licencas.softwarelivre.org/gpl-3.0.pt-br.html
  version: '1.0'
servers:
  - url: /insideflow/partners/api
    description: Generated server url
tags:
  - name: Employee Login
    description: APIs para gerenciar o login do empregado
  - name: Profile
    description: APIs para gerenciar o perfil do login do empregado
  - name: Features
    description: APIs para retornar as funcionalidades do sistema

paths:
  /v1/employee/{employeeId}/login:
    get:
      tags:
        - Employee Login
      summary: Get all employee login
      description: Get all employee login
      operationId: getAllEmployeeLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEmployeeLoginResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_EMPLOYEE_LOGIN ]
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
    post:
      tags:
        - Employee Login
      summary: Update employee contact
      description: Update employee contact
      operationId: updateEmployeeContact
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeLoginRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE_LOGIN ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/employee/{employeeId}/login/{id}:
    get:
      tags:
        - Employee Login
      summary: Get employee login by id
      description: Get employee login by id
      operationId: getEmployeeLoginById
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeLoginResponse'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_EMPLOYEE_LOGIN ]
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
    put:
      tags:
        - Employee Login
      summary: Update employee login
      description: Update employee login
      operationId: updateEmployeeLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeLoginRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE_LOGIN ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
    delete:
      tags:
        - Employee Login
      summary: Delete employee login
      description: Delete employee login
      operationId: deleteEmployeeLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ DELETE_EMPLOYEE_LOGIN ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/employee/{employeeId}/login/{id}/block:
    put:
      tags:
        - Employee Login
      summary: Block login
      description: Block login
      operationId: blockEmployeeLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE_LOGIN_STATUS ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/employee/{employeeId}/login/{id}/unblock:
    put:
      tags:
        - Employee Login
      summary: Unblock login
      description: Unblock login
      operationId: unblockEmployeeLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE_LOGIN_STATUS ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/employee/{employeeId}/login/{id}/password:
    put:
      tags:
        - Employee Login
      summary: Change password Login
      description: Change password Login
      operationId: changePasswordLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordLoginDTO'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE_LOGIN_PASSWORD ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/employee/login/info:
    get:
      tags:
        - Employee Login
      summary: get Information login
      description: get Information login
      operationId: getInformationLogin
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInformationLoginDTO'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_EMPLOYEE_LOGIN_INFO ]
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN_INFO ]
      
  /v1/employee/{employeeId}/login/{id}/profile/{profileId}:
    put:
      tags:
        - Employee Login
      summary: Update profile login
      description: Update profile login
      operationId: updateEmployeeLoginProfile
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
        - $ref: '#/components/parameters/idProfile'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_EMPLOYEE_LOGIN ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_EMPLOYEE_LOGIN
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/profile:
    get:
      tags:
        - Profile
      summary: Get all profiles
      description: Get all profiles
      operationId: getAllProfiles
      parameters:
          - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
          - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
          - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
      responses:
        '200':
          description: OK
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/GetAllProfilesDTO'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_PROFILE ]
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILES ]
    post:
      tags:
        - Profile
      summary: Create profile
      description: Create profile
      operationId: createProfile
      parameters:
          - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
          - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileDTO'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: './ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ CREATE_PROFILE ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_PROFILE
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILE ]
  /v1/profile/{id}:
    get:
      tags:
        - Profile
      summary: Get profile by id
      description: Get profile by id
      operationId: getProfileById
      parameters:
          - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
          - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
          - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/GetProfileDTO'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_PROFILE ]
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILES ]
    put:
      tags:
        - Profile
      summary: Update profile
      description: Update profile
      operationId: updateProfile
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDTO'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_PROFILE ]
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILES, INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
    delete:
      tags:
        - Profile
      summary: Delete profile
      description: Delete profile
      operationId: deleteProfile
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/idEmployee'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ DELETE_PROFILE ]
      x-jdempotentresource:
        cachePrefix: INSIDE_FLOW_PARTNERS_IDP_PROFILE
        ttl: 1
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILES, INSIDE_FLOW_PARTNERS_EMPLOYEE_LOGIN ]
  /v1/profile/{id}/features:
    put:
      tags:
        - Profile
      summary: Update features in profile
      description: Update features in profile
      operationId: updateFeaturesInProfile
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturesInProfileDTO'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_PROFILE ]
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILES ]
    delete:
      tags:
        - Profile
      summary: Delete features in profile
      description: Delete features in profile
      operationId: deleteFeaturesInProfile
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturesInProfileDTO'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          description: No_Content
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ UPDATE_PROFILE ]
      x-cache: [ INSIDE_FLOW_PARTNERS_PROFILES ]
  /v1/features:
    get:
      tags:
        - Features
      summary: Get all features
      description: Get all features
      operationId: getAllFeatures
      parameters:
        - $ref: './ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: './ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: './ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/module'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFeaturesDTO'
        '4XX':
          $ref: './ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: './ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ GET_FEATURES ]
      x-cache: [ INSIDE_FLOW_PARTNERS_FEATURES ]

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idEmployee:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    idProfile:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      x-jdempotentrequestpayload: true
    module:
      name: module
      in: header
      required: false
      description: Indica o modulo do sistema inside flow
      schema:
        type: string
        format: uuid
        example: "PARTNERS"

  schemas:
    GetAllModulesDTO:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
    FeaturesDTO:
      type: object
      properties:
        feature:
          type: string
        descriptionPtBr:
          type: string
        descriptionEng:
          type: string
        module:
          type: string
    PermissionDTO:
      type: object
      properties:
        permission:
          type: string
    GetAllPermissionDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeaturesDTO'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    FeaturesInProfileDTO:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeaturesDTO'
    ProfileDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
    GetProfileDTO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProfileDTO'
    GetAllProfilesDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDTO'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateProfileDTO:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    UpdateProfileDTO:
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        description:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    LoginsDTO:
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        status:
          type: string
        dateCreated:
          type: string
          format: date
    GetAllEmployeeLoginDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LoginsDTO'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'
    LoginDTO:
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        status:
          type: string
        dateCreated:
          type: string
          format: date
        dateLastChangePassword:
          type: string
          format: date
        profile:
          $ref: '#/components/schemas/ProfileDTO'
    GetEmployeeLoginDTO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LoginDTO'
    CreatedEmployeeLoginDTO:
      required:
      - login
      - profileId
      - password
      type: object
      properties:
        login:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        profileId:
          type: integer
          format: int64
          x-required-message: SCOS-003
          x-jdempotentrequestpayload: true
        password:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
    UpdateEmployeeLoginDTO:
      required:
        - login
        - profileId
      type: object
      properties:
        login:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
          x-jdempotentrequestpayload: true
        profileId:
          type: integer
          format: int64
          x-required-message: SCOS-003
    ChangePasswordLoginDTO:
      required:
        - passwordOld
        - passwordNew
      type: object
      properties:
        passwordOld:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001
        passwordNew:
          type: string
          x-required-message: SCOS-003
          x-empty-message: SCOS-001

    LoginStatus:
      type: string
      enum:
        - ENABLE
        - BLOCKED
        - INACTIVE
        - PENDING
        - PENDING_PASSWORD_CHANGE
    GetAllFeaturesByLoginDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeaturesDTO'
    InformationLoginDTO:
      type: object
      properties:
        loginId:
          type: integer
          format: int64
        login:
          type: string
        employeeId:
          type: integer
          format: int64
        name:
          type: string
        nameTreatment:
          type: string
        profileId:
          type: integer
          format: int64
        profileCode:
          type: string
        profileDescription:
          type: string
        position:
          type: string
        department:
          type: string
        status:
          $ref: '#/components/schemas/LoginStatus'
        features:
            type: array
            items:
                $ref: '#/components/schemas/FeaturesDTO'
    GetInformationLoginDTO:
        type: object
        properties:
            data:
              $ref: '#/components/schemas/InformationLoginDTO'
    GetAllFeaturesDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeaturesDTO'
        insidePaginatedDTO:
          $ref: './ScosComponents.yml#/components/schemas/ScosPaginated'