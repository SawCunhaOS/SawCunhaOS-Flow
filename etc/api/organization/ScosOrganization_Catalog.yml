openapi: 3.0.3
info:
  title: SawCunhaOS Organization - Catalog
  description: APIs para gestão dos catálogos de referência compartilhados entre agregados (tipos de endereço e contato).
  termsOfService: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Samuel Cunha
    url: https://github.com/SawCunhaOS
    email: samukasaww@live.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
  - url: /organization/api
tags:
  - name: AddressType
    description: APIs para gestão do catálogo de tipos de endereço
  - name: ContactType
    description: APIs para gestão do catálogo de tipos de contato

paths:
  /v1/address-types:
    get:
      tags: [AddressType]
      summary: Get all address types
      description: UC-081 - Lista todos os tipos de endereço com paginação. Pode filtrar por entityType
      operationId: getAllAddressTypes
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/entityTypeFilter'
        - $ref: '#/components/parameters/activeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAddressTypesResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_ADDRESS_TYPE]
    post:
      tags: [AddressType]
      summary: Create an address type
      description: UC-082 - Cria um novo tipo de endereço
      operationId: createAddressType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressTypeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: '../ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_ADDRESS_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_CREATE_ADDRESS_TYPE
        ttl: 1

  /v1/address-types/{id}:
    get:
      tags: [AddressType]
      summary: Get address type by id
      description: UC-083 - Retorna os dados de um tipo de endereço
      operationId: getAddressTypeById
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAddressTypeResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_ADDRESS_TYPE]
    put:
      tags: [AddressType]
      summary: Update address type
      description: UC-084 - Atualiza o código, descrição ou entityType de um tipo de endereço
      operationId: updateAddressType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressTypeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_ADDRESS_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_UPDATE_ADDRESS_TYPE
        ttl: 1

  /v1/address-types/{id}/enable:
    put:
      tags: [AddressType]
      summary: Activate address type
      description: UC-085 - Reativa tipo de endereço com active=false
      operationId: activateAddressType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_ADDRESS_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_ACTIVATE_ADDRESS_TYPE
        ttl: 1

  /v1/address-types/{id}/disable:
    put:
      tags: [AddressType]
      summary: Inactivate address type
      description: UC-086 - Inativa tipo de endereço com active=true
      operationId: inactivateAddressType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_ADDRESS_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_INACTIVATE_ADDRESS_TYPE
        ttl: 1

  /v1/contact-types:
    get:
      tags: [ContactType]
      summary: Get all contact types
      description: UC-087 - Lista todos os tipos de contato com paginação. Pode filtrar por entityType
      operationId: getAllContactTypes
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/paginationFilter'
        - $ref: '#/components/parameters/entityTypeFilter'
        - $ref: '#/components/parameters/activeFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllContactTypesResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_CONTACT_TYPE]
    post:
      tags: [ContactType]
      summary: Create a contact type
      description: UC-088 - Cria um novo tipo de contato
      operationId: createContactType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactTypeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '201':
          $ref: '../ScosComponents.yml#/components/responses/201_CREATED'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [CREATE_CONTACT_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_CREATE_CONTACT_TYPE
        ttl: 1

  /v1/contact-types/{id}:
    get:
      tags: [ContactType]
      summary: Get contact type by id
      description: UC-089 - Retorna os dados de um tipo de contato
      operationId: getContactTypeById
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactTypeResponse'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [GET_CONTACT_TYPE]
    put:
      tags: [ContactType]
      summary: Update contact type
      description: UC-090 - Atualiza o código, descrição ou entityType de um tipo de contato
      operationId: updateContactType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactTypeRequest'
        x-jdempotentrequestpayload: true
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [UPDATE_CONTACT_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_UPDATE_CONTACT_TYPE
        ttl: 1

  /v1/contact-types/{id}/enable:
    put:
      tags: [ContactType]
      summary: Activate contact type
      description: UC-091 - Reativa tipo de contato com active=false
      operationId: activateContactType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [ENABLE_CONTACT_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_ACTIVATE_CONTACT_TYPE
        ttl: 1

  /v1/contact-types/{id}/disable:
    put:
      tags: [ContactType]
      summary: Inactivate contact type
      description: UC-092 - Inativa tipo de contato com active=true
      operationId: inactivateContactType
      parameters:
        - $ref: '../ScosComponents.yml#/components/parameters/X-Request-ID'
        - $ref: '../ScosComponents.yml#/components/parameters/Accept-Language'
        - $ref: '../ScosComponents.yml#/components/parameters/idRequest'
      responses:
        '204':
          $ref: '../ScosComponents.yml#/components/responses/204_NO_CONTENT'
        '4XX':
          $ref: '../ScosComponents.yml#/components/responses/4XX'
        '5XX':
          $ref: '../ScosComponents.yml#/components/responses/5XX'
      x-authorize: [DISABLE_CONTACT_TYPE]
      x-jdempotentresource:
        cachePrefix: SCOS_ORGANIZATION_IDP_INACTIVATE_CONTACT_TYPE
        ttl: 1

components:
  securitySchemes:
    BearerAuth:
      $ref: '../ScosComponents.yml#/components/securitySchemes/BearerAuth'
  parameters:
    entityTypeFilter:
      name: entityType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CatalogEntityType'
    activeFilter:
      name: active
      in: query
      required: false
      schema:
        type: boolean
  schemas:
    CatalogEntityType:
      type: string
      enum:
        - COMPANY
        - EMPLOYEE
    AddressType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
        active:
          type: boolean
    GetAddressTypeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AddressType'
    GetAllAddressTypesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AddressType'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateAddressTypeRequest:
      required: [code, description, entityType]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
    UpdateAddressTypeRequest:
      required: [code, description, entityType]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
    ContactType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
        active:
          type: boolean
    GetContactTypeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ContactType'
    GetAllContactTypesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactType'
        paginatedDTO:
          $ref: '../ScosComponents.yml#/components/schemas/ScosPaginated'
    CreateContactTypeRequest:
      required: [code, description, entityType]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
          x-jdempotentrequestpayload: true
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'
    UpdateContactTypeRequest:
      required: [code, description, entityType]
      type: object
      properties:
        code:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        description:
          type: string
          x-required-message: SCOS_VALIDATION_003
          x-empty-message: SCOS_VALIDATION_001
        entityType:
          $ref: '#/components/schemas/CatalogEntityType'

security:
  - BearerAuth: []
