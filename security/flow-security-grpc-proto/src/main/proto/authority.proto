syntax = "proto3";
import "google/protobuf/wrappers.proto";

option java_multiple_files = true;
option java_package = "br.com.sawcunhaos.security.grpc.proto";
option java_outer_classname = "AuthorityProto";

package br.com.sawcunhaos.security.grpc.proto;

service ValidateAuthorityService {
  rpc validateAuthority(AuthorityRequest) returns (AuthorityResponse);
}

message AuthorityRequest {
  string login = 1;
}

message AuthorityResponse {
  string login = 1;
  string name = 2;
  optional string email = 3;
  optional int64 company_id = 4;
  optional string company_name = 5;
  optional int64 branch_id = 6;
  optional string branch_name = 7;
  optional int64 employee_id = 8;
  repeated string permissions = 9;
}
