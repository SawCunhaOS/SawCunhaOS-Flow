scos:
  port: ${SCOS_PORT:8090}
  datasource:
    url: '${SCOS_DB_URL:jdbc:postgresql://localhost:5432/scos?currentSchema=${SCOS_DB_SCHEMA:scos}}'
    username: ${SCOS_DB_USERNAME:scos}
    password: '${SCOS_DB_PASSWORD:scos#2026}'          # prod: setar via env; default versionado é só dev
    connection-timeout: ${SCOS_DB_CONN_TIMEOUT:600000}
    idle-timeout: ${SCOS_DB_IDLE_TIMEOUT:150000}
    max-lifetime: ${SCOS_DB_MAX_LIFETIME:1800000}
    minimum-idle: ${SCOS_DB_MIN_IDLE:25}               # manter <= SCOS_DB_MAX_POOL_SIZE
    maximum-pool-size: ${SCOS_DB_MAX_POOL_SIZE:100}
  audit:
    enabled: ${SCOS_AUDIT_ENABLED:true}
    datasource:
      url: '${SCOS_AUDIT_DB_URL:jdbc:postgresql://localhost:5432/scos?currentSchema=${SCOS_DB_SCHEMA:scos}}'
      username: ${SCOS_AUDIT_DB_USERNAME:scos}
      password: '${SCOS_AUDIT_DB_PASSWORD:scos#2026}'  # prod: setar via env; default versionado é só dev
      connection-timeout: ${SCOS_AUDIT_DB_CONN_TIMEOUT:100000}
      idle-timeout: ${SCOS_AUDIT_DB_IDLE_TIMEOUT:150000}
      max-lifetime: ${SCOS_AUDIT_DB_MAX_LIFETIME:300000}
      minimum-idle: ${SCOS_AUDIT_DB_MIN_IDLE:10}
      maximum-pool-size: ${SCOS_AUDIT_DB_MAX_POOL_SIZE:30}
  security:
    keycloak:
      client-id: Scos
      authorization-grant-type: password
      scope: openid
      issuer-uri: '${SCOS_KEYCLOAK_ISSUER_URI:http://localhost:7080/realms/Scos}'
      resourceId: "Scos"
  cache:
    enable: ${SCOS_CACHE_ENABLE:false}
    key-prefix: 'grpc::'
    time-to-live: ${SCOS_CACHE_TTL:12000000}
    port: ${SCOS_REDIS_PORT:26379}
    database: ${SCOS_CACHE_DATABASE:0}
    master: scos_master
    password: '${SCOS_REDIS_PASSWORD:scos#2026}'       # prod: setar via env; default versionado é só dev
    sentinels: '${SCOS_REDIS_SENTINELS:localhost:26379}'
  privacy:
    enabled: ${SCOS_PRIVACY_ENABLED:true}             # loads on import
    strict: ${SCOS_PRIVACY_STRICT:false}              # prod: error if hash/encrypt has no key (setar crypto.secret junto)
    max-payload-kb: ${SCOS_PRIVACY_MAX_PAYLOAD_KB:64} # truncate before masking, bounds worst case
    masking:
      default-patterns: true
    log:
      register-converter: true                        # %mask registered programmatically (see below)
    crypto:
      secret: '${SCOS_PRIVACY_CRYPTO_SECRET:ASDASDASDA}'  # prod: setar via env; default versionado é só dev
