server:
  port: ${scos.port:8090}
  http2:
    enabled: true

eureka:
  client:
    registerWithEureka: false
    fetchRegistry: false
  instance:
    preferIpAddress: true

spring:
  grpc:
    server:
      # Aumenta o tempo de tolerância para fechar conexões antigas de forma segura
      max-connection-age-grace: 30s
      # Define o tempo máximo que uma conexão pode ficar ociosa
      max-connection-idle: 30m
      # Evita que o servidor derrube conexões ativas muito rápido
      max-connection-age: 1h
  cache:
    enabled: false
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  application:
    name: ScosOrganizationGrpcBoot
  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false
  datasource:
    url: ${scos.datasource.url}
    username: ${scos.datasource.username}
    password: ${scos.datasource.password}
    hikari:
      pool-name: Inside_Flow-Fat
      registerMbeans: false
      connection-timeout: ${scos.datasource.connection-timeout}
      idle-timeout: ${scos.datasource.idle-timeout}
      max-lifetime: ${scos.datasource.max-lifetime}
      minimum-idle: ${scos.datasource.minimum-idle}
      maximum-pool-size: ${scos.datasource.maximum-pool-size}
      leak-detection-threshold: 0
      validation-timeout: 15000
      keepalive-time: 300000
    audit:
      url: ${scos.audit.datasource.url}
      username: ${scos.audit.datasource.username}
      password: ${scos.audit.datasource.password}
      hikari:
        pool-name: Inside_Flow_Audit-Fat
        registerMbeans: false
        connection-timeout: ${scos.audit.datasource.connection-timeout}
        idle-timeout: ${scos.audit.datasource.idle-timeout}
        max-lifetime: ${scos.audit.datasource.max-lifetime}
        minimum-idle: ${scos.audit.datasource.minimum-idle}
        maximum-pool-size: ${scos.audit.datasource.maximum-pool-size}
        leak-detection-threshold: 20000
        connection-test-query: SELECT 1
        validation-timeout: 5000
        auto-commit: false
        data-source-properties:
          cachePrepStmts: true
          prepStmtCacheSize: 1000
          prepStmtCacheSqlLimit: 4096
          useServerPrepStmts: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        show_sql: ${SCOS_JPA_SHOW_SQL:true}
        format_sql: ${SCOS_JPA_SHOW_SQL:true}
        enable_lazy_load_no_trans: false
        ddl-auto: validate
        generate_statistics: ${SCOS_JPA_GENERATE_STATISTICS:true}
        naming:
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
          physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        cache:
          use_second_level_cache: false
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: ${SCOS_JPA_SLOW_QUERY_MS:500}
        jdbc:
          batch_size: 100
          order_updates: true
          order_inserts: true
          batch_versioned_data: true
          time_zone: UTC
        connection:
          provider_disables_autocommit: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 4096
          fail_on_pagination_over_collection_fetch: true
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    build:
      enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${SCOS_TRACING_SAMPLING:1.0}
  management:
    metrics:
      enable:
        jvm: true
        process: true
        system: true
        executor: true
        jvm.threads: true
      export:
        prometheus:
          enabled: true
      distribution:
        percentiles-histogram:
          http.server.requests: true
        sla:
          http:
            server:
              requests: 50ms,100ms,200ms,300ms,500ms,1s
      tags:
        application: Inside_Flow-Fat
    observations:
      key-values:
        application: ${spring.application.name}

scos:
  liquibase:
    enabled: ${SCOS_LIQUIBASE_ENABLED:false}
  filter:
    show-request-body: ${SCOS_LOG_SHOW_REQUEST_BODY:false}
    show-request-headers: ${SCOS_LOG_SHOW_REQUEST_HEADERS:false}
    show-response-body: ${SCOS_LOG_SHOW_RESPONSE_BODY:false}
  audit:
    system: SCOS_ORGANIZATION
    enabled: ${scos.audit.enabled}
    liquibase:
      enabled: false
  security:
    enabled: false